<style>
:root{--sb:env(safe-area-inset-bottom,0px);--bg:#f4f1ea;--ink:#222;--muted:#6b6b6b;--accent:#2f3b2f;--accent2:#c8742c;--line:#d9d3c7;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
#app{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{flex:none;display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 6px 6px 10px;background:var(--accent);color:#fff;min-height:52px}
.hlogo{width:34px;height:34px;border-radius:8px;flex:none}
.htitle{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15;padding-left:4px}
.hname{font-size:18px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
#ver{font-size:11px;font-weight:400;opacity:.55;margin-left:2px}
.htrip{border:0;background:none;color:#fff;opacity:.8;font:inherit;font-size:13px;padding:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.htrip::after{content:" ▾";opacity:.7}
.hbtn{position:relative;flex:none;width:42px;height:42px;border:0;border-radius:50%;background:none;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.hbtn:active{background:rgba(255,255,255,.15)}
.sdot{position:absolute;top:7px;right:7px;width:10px;height:10px;border-radius:50%;background:var(--accent2);border:2px solid #92b78c;display:none}
.hbtn.busy svg{animation:spin 1s linear infinite}
#driveBar{position:absolute;left:0;right:0;bottom:0;z-index:700;display:none;flex-direction:column;gap:8px;padding:10px 10px calc(10px + var(--sb));background:rgba(34,44,33,.93);color:#fff;box-shadow:0 -4px 16px rgba(0,0,0,.3)}
#driveBar .dinfo{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;opacity:.95;padding:0 4px}#driveBar .dinfo b{font-size:20px}
#driveBar .recdot{color:#ff8a80;font-weight:700}
#driveBar .dbtns{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr 1fr;gap:8px}
.dbtn{border:0;border-radius:14px;min-height:76px;background:rgba(255,255,255,.12);color:#fff;font:inherit;font-size:12.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 2px}
.dbtn svg{stroke:currentColor}.dbtn.main{background:var(--accent2)}.dbtn.rec{background:rgba(229,57,53,.35)}.dbtn:active{transform:scale(.97)}
body.drive .fab:not(#locBtn){display:none!important}body.drive #locBtn{bottom:calc(150px + var(--sb))!important}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.qbtn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:600;color:var(--ink)}
/* Nachtmodus: dunkle Bedienung, Kartenbilder abgedunkelt, Vektorkarte im dunklen Stil */
body.night{--bg:#171b17;--ink:#e9e7e1;--muted:#a4aa9f;--card:#242a23;--line:#3a4238;--accent:#1d251c}
body.night .panel{background:#1c231b;--muted:#aab5a6;--line:#3a4a37}
body.night .panel input:not([type=checkbox]):not([type=radio]),body.night .panel select,body.night .panel textarea{background:#2a3229;color:var(--ink);border-color:#3f4a3d}
body.night .fab,body.night .ptop .px{background:#2a3229;color:var(--ink)}
body.night .btn.sec{background:#323b30;color:var(--ink)}
body.night .toast{background:#e9e7e1;color:#171b17}
body.night .leaflet-tile-pane{filter:brightness(.62) contrast(1.08) saturate(.85)}
body.night.vecon .leaflet-tile-pane{filter:none}
body.night .leaflet-control-layers,body.night .leaflet-bar a{background:#2a3229;color:var(--ink)}
body.night header{background:#1d251c!important;color:#e9e7e1}body.night header .hname,body.night header .htrip,body.night header .hbtn{color:#e9e7e1!important}
body.night .ptop{background:#1c231b}
body.night .panel *{text-shadow:none!important}
body.night .mic{background:#323b30!important;color:var(--ink)}
body.night .ovc.ok{background:#25402a;color:#9be0a5}body.night .ovc.part{background:#4a3320;color:#ffc48a}body.night .ovc.no{background:#ffffff14}
body.night .leaflet-container{background:#111}
.hbtn.expired::after{content:"!";position:absolute;top:5px;right:5px;width:15px;height:15px;border-radius:50%;background:#e53935;color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1}
.hbtn.expired .sdot{display:none!important}@keyframes spin{to{transform:rotate(360deg)}}
.gdot{position:absolute;right:8px;bottom:9px;width:9px;height:9px;border-radius:50%;background:#9e9e9e;border:2px solid var(--accent)}
#gpsInfo.ok .gdot{background:#4caf50}#gpsInfo.bad .gdot{background:#e53935}
@keyframes pulse{50%{opacity:.8}}
.ovc{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:12px;font-size:12.5px;margin:2px 4px 2px 0}.ovc.no{background:#0000000d;color:var(--muted)}.ovc.ok{background:#d9f0dc;color:#1f6b2a}.ovc.part{background:#fde7d3;color:#9a4a00}.ovc.off{border:1px dashed #0003;color:var(--muted)}.ovx{border:0;background:none;color:var(--muted);padding:4px;border-radius:8px;cursor:pointer;display:flex}.ovx:active{background:#0001}
.ovb{padding:4px 10px!important;min-height:0!important;font-size:12.5px!important}
.bar{height:10px;background:#ddd;border-radius:5px;overflow:hidden;margin:10px 0}.bar div{height:100%;background:var(--accent2);width:0}
#map{flex:1;position:relative;min-height:0}
nav{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:var(--sb)}
nav button{border:0;background:none;padding:10px 4px 12px;font-size:13px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:22px;line-height:1}

.fab.add{background:var(--accent2);color:#fff;font-size:28px;font-weight:700;width:56px;height:56px;right:8px}
#locBtn{bottom:calc(20px + var(--sb))}
.fab{display:flex;align-items:center;justify-content:center;color:var(--ink);position:absolute;right:12px;bottom:20px;z-index:500;width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);font-size:22px}

.stars{display:inline-flex;gap:2px;vertical-align:middle}

.stars button.on{color:#e0a100}
.rate{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px}
.rate .rrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:wrap}
.rate .rrow b{font-weight:600;font-size:14px}
.rate input{margin-top:4px;padding:6px 8px;font-size:14px}
.sv{color:#e0a100;letter-spacing:1px}

.clu b{position:absolute;right:-6px;top:-6px;background:#222;color:#fff;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.ico{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none;vertical-align:middle}
.chip .ico{margin-right:4px}
.chip svg{vertical-align:-3px;margin-right:4px}
.lfh{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 2px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin-top:4px}
.catgrid button{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;font:inherit;font-size:12px;color:var(--ink);line-height:1.2;text-align:center}
.catgrid button.on{border-color:var(--accent2);background:#fff6ec;font-weight:600}
.osmpin{border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:600;background:var(--accent2);color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.3);display:none}
.sheet{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;z-index:1000;background:rgba(0,0,0,.35);display:none}
.sheet.open{display:block}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:calc(24px + var(--sb)) !important;background:var(--bg);border-radius:16px 16px 0 0;padding:14px 16px 24px}
@media (min-width:900px){.panel{left:auto;right:0;top:0;bottom:0;width:440px;max-height:none;border-radius:0}}
/* Titelleiste und Leisten ebenfalls im Logo-Stil */
.hlogo{box-shadow:0 0 0 1px rgba(0,0,0,.25)}
header{background:#92b78c url(topo.svg) repeat;background-size:360px;color:#13200f;border-bottom:1px solid #6f9469}

.mrow.main .mic{background:var(--accent);color:#fff}

body.adm #app{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,30%);grid-template-rows:auto minmax(0,1fr)}

<script type="text/js-worker" id="pbfWk">
/* IbexMap – Leser für OpenStreetMap-Rohdaten (.osm.pbf von Geofabrik). Läuft als Hintergrund-Prozess (Web Worker).
   Liest POI (Knoten und Flächen) und Strassen mit Belag in zwei Durchgängen: zuerst die Wege, dann die benötigten Knoten. */
"use strict";
let P=null;
const td=new TextDecoder();
function rd(b,o){let x=b[o.p++];if(x<128)return x;let r=x&127,m=128;do{x=b[o.p++];r+=(x&127)*m;m*=128;}while(x&128);return r;}
const zz=z=>z%2?-(z+1)/2:z/2;
function skip(b,o,wt){if(wt===0)rd(b,o);else if(wt===2){const l=rd(b,o);o.p+=l;}else if(wt===1)o.p+=8;else if(wt===5)o.p+=4;else throw new Error("Format");}
function packed(b,o,f){const l=rd(b,o),e=o.p+l;while(o.p<e)f(rd(b,o));}
async function slice(file,a,n){return new Uint8Array(await file.slice(a,a+n).arrayBuffer());}
async function index(file,prog){const out=[];let pos=0;const size=file.size;
  while(pos<size){const h4=await slice(file,pos,4);const hl=((h4[0]<<24)>>>0)+(h4[1]<<16)+(h4[2]<<8)+h4[3];
    const hb=await slice(file,pos+4,hl);const o={p:0};let type="",ds=0;

function prepCountries(){(countryData||[]).forEach(f=>{if(f.b)return;let a=180,b=90,c=-180,d=-90;
  const polys=f.g.type==="Polygon"?[f.g.coordinates]:f.g.coordinates;
  polys.forEach(p=>p[0].forEach(([x,y])=>{if(x<a)a=x;if(y<b)b=y;if(x>c)c=x;if(y>d)d=y;}));f.b=[a,b,c,d];});}
async function downloadCountries(){const fc=await(await fetch(COUNTRY_SRC)).json();
  const r=v=>Math.round(v*1000)/1000,rd=g=>g.type==="Polygon"?{type:"Polygon",coordinates:g.coordinates.map(ring=>ring.map(([x,y])=>[r(x),r(y)]))}

    let c=[P.ISO_A2_EH,P.ISO_A2,P.WB_A2].find(v=>v&&/^[A-Z]{2}$/.test(v))||"";

function countryOf(lat,lon){if(!countryData)return "";let c=countryAt(lat,lon);if(c)return c;

const OVERPASS=["https://overpass-api.de/api/interpreter","https://maps.mail.ru/osm/tools/overpass/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://overpass.private.coffee/api/interpreter"];

const osmLayer=L.layerGroup().addTo(map);const osmCanvas=L.canvas({padding:.3});
function osmType(t){if(t.amenity==="fuel")return "fuel";
  if(/^(drinking_water|water_point|fountain)$/.test(t.amenity||"")||/^(water_tap|water_well)$/.test(t.man_made||"")||t.natural==="spring")return "water";
  if(/^(car_repair|tyres|car_parts)$/.test(t.shop||"")||t.craft==="mechanic"||t.service==="tyres")return "service";
  if(/^(supermarket|convenience|general|greengrocer)$/.test(t.shop||""))return "shop";return "";}
function osmKind(t){const m={supermarket:"Supermarkt",convenience:"Laden / Hanout",general:"Gemischtwaren",greengrocer:"Gemüse/Obst",car_repair:"Autowerkstatt",tyres:"Reifen / Vulkaniseur",car_parts:"Autoteile"};
  if(osmType(t)==="water"){const dw=t.drinking_water,base=t.amenity==="drinking_water"?"Trinkwasserstelle":t.amenity==="water_point"?"Wasserstelle (Tank füllen)":t.amenity==="fountain"?"Brunnen":t.man_made==="water_tap"?"Wasserhahn":t.man_made==="water_well"?"Ziehbrunnen":t.natural==="spring"?"Quelle":"Wasser";
    return base+(t.amenity==="drinking_water"||dw==="yes"?" – Trinkwasser":dw==="no"?" – kein Trinkwasser":dw==="treated"?" – aufbereitet":" – Trinkbarkeit unbekannt");}
  return t.amenity==="fuel"?"Tankstelle":t.craft==="mechanic"?"Mechaniker":m[t.shop]||"";}
const KEEP=["drinking_water","natural","man_made","name","name:fr","name:ar","brand","opening_hours","phone","contact:phone","website","addr:city","addr:street","fuel:diesel","shop","amenity","craft","service"];
function osmQuery(scope){const cc=/^[A-Z]{2}$/.test(scope);const f=cc?"(area.a)":`(${scope})`;
  return `[out:json][timeout:240];${cc?`area["ISO3166-1"="${scope}"][admin_level=2]->.a;`:""}(`+
   `nwr["shop"~"^(supermarket|convenience|general|greengrocer|car_repair|tyres|car_parts)$"]${f};`+
   `nwr["amenity"="fuel"]${f};nwr["craft"="mechanic"]${f};`+
   `nwr["amenity"~"^(drinking_water|water_point|fountain)$"]${f};nwr["man_made"~"^(water_tap|water_well)$"]${f};node["natural"="spring"]${f};);out center tags;`;}
async function osmFetch(scope){let last;
  for(const ep of OVERPASS){try{const r=await fetch(ep,{method:"POST",body:"data="+encodeURIComponent(osmQuery(scope)),headers:{"Content-Type":"application/x-www-form-urlencoded"}});
      if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();
      return j.elements.map(e=>{const t=e.tags||{};const k={};KEEP.forEach(x=>{if(t[x])k[x]=t[x];});
        const lat=e.lat??(e.center&&e.center.lat),lon=e.lon??(e.center&&e.center.lon);
        return {id:e.type[0]+e.id,lat,lon,ty:osmType(t),t:k};}).filter(x=>x.ty&&x.lat!=null);}
    catch(err){last=err;}}
  throw last||new Error("Overpass nicht erreichbar");}
async function osmLoad(scope,label){
  toast(/^[A-Z]{2}$/.test(scope)?`Lade Orte für ${label} … (kann 1–3 Minuten dauern)`:"Lade Orte im Kartenausschnitt …",180000);
  try{const items=await osmFetch(scope);const byId=new Map(osmData.items.map(x=>[x.id,x]));items.forEach(x=>byId.set(x.id,x));
    const sc=new Set((osmData.scope||"").split(", ").filter(Boolean));sc.add(label);osmData={items:[...byId.values()],loaded:Date.now(),scope:[...sc].join(", ")};await put("meta",Object.assign({id:"osmpoi"},osmData));
    if(!osmShow.length){osmShow=Object.keys(OSM);saveOsmShow();}
    toast(`${items.length} Orte geladen – gespeichert für offline`,4000);drawOsm();return true;}
  catch(e){toast("Laden fehlgeschlagen – Internet? Später nochmals versuchen.",5000);return false;}}
function osmCC(){const c=map.getCenter();return countryOf(c.lat,c.lng);}

if(!poiShow.length&&osmShow.length){const m={shop:["1","2"],fuel:["6"],service:["6"],water:["8"]};poiShow=[...new Set(osmShow.flatMap(k=>m[k]||[]))];osmShow=[];
  try{localStorage.setItem("rb_poishow",JSON.stringify(poiShow));localStorage.setItem("rb_osm","[]");}catch(e){}}
function drawOsm(){osmLayer.clearLayers();
  filtState();
  /* POI-Overlay aus den offline gespeicherten Ländern (Gruppen wie in der Suche) */
  if(poiShow.length&&poiOff.length&&map.getZoom()>=OSM_MINZOOM&&!ADM){const b=map.getBounds().pad(.2),big=map.getZoom()>=14;let n=0;
    for(const p of poiOff)for(const x of p.items){if(n>1500)break;if(!b.contains([x.a,x.o]))continue;const k=x.m.find(m=>poiShow.includes(m.split(".")[0]));if(!k)continue;
      const g=POI_GROUPS[+k.split(".")[0]];n++;
      const mk=big?L.marker([x.a,x.o],{icon:L.divIcon({className:"",iconSize:[24,24],iconAnchor:[12,12],html:`<div class="osmpin" style="width:24px;height:24px;background:${g.c}">${svgI(g.i,15)}</div>`})})
        :L.circleMarker([x.a,x.o],{renderer:osmCanvas,radius:6,color:"#fff",weight:2,fillColor:g.c,fillOpacity:.95});
      mk.addTo(osmLayer).on("click",ev=>{L.DomEvent.stopPropagation(ev);showPoi(x);});}}
  return;/* früherer «Versorgung»-Download ist im POI-Overlay aufgegangen */
  const b=map.getBounds().pad(.2);
  osmData.items.forEach(x=>{if(!osmShow.includes(x.ty)||!b.contains([x.lat,x.lon]))return;const c=OSM[x.ty];
    const mk=map.getZoom()>=14?L.marker([x.lat,x.lon],{icon:L.divIcon({className:"",iconSize:[24,24],iconAnchor:[12,12],html:`<div class="osmpin" style="width:24px;height:24px;background:${c.c}">${svgI(x.ty,15)}</div>`})})
      :L.circleMarker([x.lat,x.lon],{renderer:osmCanvas,radius:6,color:"#fff",weight:2,fillColor:c.c,fillOpacity:.95});
    mk.addTo(osmLayer).on("click",ev=>{L.DomEvent.stopPropagation(ev);showOsm(x);});});}
map.on("moveend zoomend",drawOsm);
function showPoi(x){const [gi,ii]=x.m[0].split(".").map(Number),g=POI_GROUPS[gi],kind=g.items[ii][0],t=x.t;
  const nm=t.name||t["name:fr"]||t["name:de"]||t.brand||kind;const d=me?` · ${distKm(me,{lat:x.a,lon:x.o}).toFixed(1)} km Luftlinie`:"";
  const row=(l,v)=>v?`<div><b>${l}:</b> ${esc(v)}</div>`:"";

    <div class="muted">${esc(x.m.map(k=>{const [a,b]=k.split(".").map(Number);return POI_GROUPS[a].items[b][0];}).join(", "))}${t.brand&&t.brand!==nm?" · "+esc(t.brand):""}${d}</div>
    ${row("Arabisch",t["name:ar"])}${row("Öffnungszeiten",t.opening_hours)}${row("Telefon",t.phone||t["contact:phone"])}${row("Ort",t["addr:city"])}${row("Gebühr",t.fee==="yes"?"ja":t.fee==="no"?"nein":"")}
    ${safeUrl(t.website)?`<div><a href="${esc(safeUrl(t.website))}" target="_blank" rel="noopener noreferrer">Webseite</a></div>`:""}
    <p class="muted">Quelle: © OpenStreetMap-Mitwirkende (offline gespeichert). Angaben können veraltet sein.</p>
    <div class="actions"><a class="btn or" href="geo:${x.a},${x.o}?q=${x.a},${x.o}(${encodeURIComponent(nm)})">Navigieren (OsmAnd)</a>
    <button class="btn sec" id="oTake">Als eigenen Punkt übernehmen</button><button class="btn sec" id="oClose">Schliessen</button></div></div>`);
  $("#oClose").onclick=closePanel;
  $("#oTake").onclick=()=>{const desc=[kind,t.opening_hours&&("Öffnungszeiten: "+t.opening_hours),(t.phone||t["contact:phone"])&&("Tel. "+(t.phone||t["contact:phone"]))].filter(Boolean).join("\n");
    editPoint(newPoint(x.a,x.o,{title:nm===kind?"":nm,cat:g.i in CATS?g.i:"sight",desc,source:"OpenStreetMap"}),true);};}
function showOsm(x){const c=OSM[x.ty],t=x.t;const nm=t.name||t["name:fr"]||t.brand||osmKind(t)||c.n;
  const d=me?` · ${distKm(me,x).toFixed(1)} km Luftlinie`:"";
  const row=(l,v)=>v?`<div><b>${l}:</b> ${esc(v)}</div>`:"";
  openPanel(`<div class="detail"><h2>${icoBadge(x.ty,c.c,28)} ${esc(nm)}</h2>
    <div class="muted">${esc(osmKind(t)||c.n)}${t.brand&&t.brand!==nm?" · "+esc(t.brand):""}${d}</div>
    ${row("Arabisch",t["name:ar"])}${row("Öffnungszeiten",t.opening_hours)}${row("Telefon",t.phone||t["contact:phone"])}
    ${row("Adresse",[t["addr:street"],t["addr:city"]].filter(Boolean).join(", "))}${row("Diesel",t["fuel:diesel"]==="yes"?"ja":t["fuel:diesel"]==="no"?"nein":"")}
    ${safeUrl(t.website)?`<div><a href="${esc(safeUrl(t.website))}" target="_blank" rel="noopener noreferrer">Webseite</a></div>`:""}
    <p class="muted">Quelle: © OpenStreetMap-Mitwirkende. Angaben können veraltet sein.</p>
    <div class="actions"><a class="btn or" href="geo:${x.lat},${x.lon}?q=${x.lat},${x.lon}(${encodeURIComponent(nm)})">Navigieren (OsmAnd)</a>
    <button class="btn sec" id="oTake">Als eigenen Punkt übernehmen</button><button class="btn sec" id="oClose">Schliessen</button></div></div>`);
  $("#oClose").onclick=closePanel;
  $("#oTake").onclick=()=>{const desc=[osmKind(t),t.opening_hours&&("Öffnungszeiten: "+t.opening_hours),(t.phone||t["contact:phone"])&&("Tel. "+(t.phone||t["contact:phone"]))].filter(Boolean).join("\n");
    editPoint(newPoint(x.lat,x.lon,Object.assign({title:nm,cat:x.ty,desc,source:"OpenStreetMap"},x.ty==="water"?{water:(t.amenity==="drinking_water"||t.drinking_water==="yes")?"trink":t.drinking_water==="no"?"brauch":"unklar"}:{})),true);};}

/* ---------- GPS ---------- */
let me=null,meMarker=null,meCircle=null,follow=false,watchId=null,lastPosT=0;
/* Bezugspunkt für «Nächste zuerst»: aktueller Standort, sonst der zuletzt bekannte, sonst die Kartenmitte */
function refPos(){if(me)return {lat:me.lat,lon:me.lon,src:"Standort"};
  try{const l=JSON.parse(localStorage.getItem("rb_lastpos")||"null");if(l&&isFinite(l.lat))return {lat:l.lat,lon:l.lon,src:`letzter Standort ${fmtDT(l.t)}`};}catch(e){}
  const c=map.getCenter();return {lat:c.lat,lon:c.lng,src:"Kartenmitte (kein Standort bekannt)"};}
function gpsState(cls,txt){const b=$("#gpsInfo");b.classList.remove("ok","bad");if(cls)b.classList.add(cls);b.title=txt;b.dataset.txt=txt;}
$("#gpsInfo").onclick=()=>toast($("#gpsInfo").dataset.txt||"GPS aus",4000);
function startGPS(){
  if(!("geolocation" in navigator)){gpsState("bad","Kein GPS");return;}
  if(watchId!==null)return;
  watchId=navigator.geolocation.watchPosition(pos=>{
    me={lat:pos.coords.latitude,lon:pos.coords.longitude,acc:pos.coords.accuracy};
    if(!lastPosT||Date.now()-lastPosT>30000){lastPosT=Date.now();try{localStorage.setItem("rb_lastpos",JSON.stringify({lat:me.lat,lon:me.lon,t:lastPosT}));}catch(e){}}
    gpsState("ok",`GPS ±${Math.round(me.acc)} m`);lastSpd=pos.coords.speed;trkAdd(me.lat,me.lon,me.acc);if(driveOn)driveInfo();
    if(!meMarker){meMarker=L.circleMarker([me.lat,me.lon],{radius:8,color:"#fff",weight:3,fillColor:"#1e88e5",fillOpacity:1}).addTo(map);
      meCircle=L.circle([me.lat,me.lon],{radius:me.acc,color:"#1e88e5",weight:1,fillOpacity:.1}).addTo(map);}
    else{meMarker.setLatLng([me.lat,me.lon]);meCircle.setLatLng([me.lat,me.lon]).setRadius(me.acc);}
    if(follow)map.setView([me.lat,me.lon],Math.max(map.getZoom(),14));
  },err=>{gpsState("bad","GPS: "+(err.code===1?"nicht erlaubt – in den Einstellungen des Browsers bzw. der App den Standort erlauben":"kein Signal"));},
  {enableHighAccuracy:true,maximumAge:5000,timeout:30000});
}
$("#locBtn").onclick=()=>{startGPS();if($("#gpsInfo").classList.contains("bad")){toast($("#gpsInfo").dataset.txt,5000);return;}follow=!follow;$("#locBtn").classList.toggle("follow",follow);
  if(follow&&me)map.setView([me.lat,me.lon],Math.max(map.getZoom(),14));
  toast(follow?"Karte folgt deinem Standort":"Karte folgt nicht mehr");};
map.on("dragstart",()=>{if(follow){follow=false;$("#locBtn").classList.remove("follow");}});
function distKm(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

/* ---------- Fotos ---------- */
function resize(file,max=1280,q=.8){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);
  img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(u);
    cv.toBlob(b=>b?res(b):rej(new Error("Bild")),"image/jpeg",q);};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("Bild konnte nicht gelesen werden"));};img.src=u;});}
/* Foto-Adressen im Arbeitsspeicher begrenzen (älteste nach 150 freigeben, damit das Handy flüssig bleibt) */
const thumbOrder=[];
async function photoURL(id){if(thumbs[id])return thumbs[id];const p=await getOne("photos",id);if(!p)return "";thumbs[id]=URL.createObjectURL(p.blob);thumbOrder.push(id);
  while(thumbOrder.length>150){const old=thumbOrder.shift();const u=thumbs[old];delete thumbs[old];if(u)setTimeout(()=>URL.revokeObjectURL(u),30000);}
  return thumbs[id];}

/* ---------- Panel ---------- */
/* Panels: oben immer ✕ (schliessen) und – wenn aus dem Menü geöffnet – «‹ Menü». Android-Zurück schliesst ebenfalls. */
let panelKind="",panelBack=null,panelHist=false;
const PARENTS={menu:["‹ Menü",()=>$("#navMenu").onclick()],list:["‹ Liste",()=>showList()]};
let panelBackLbl="";
/* Textfelder wachsen mit dem Inhalt mit */
function autoGrow(el){if(!el||el.tagName!=="TEXTAREA")return;el.style.height="auto";el.style.height=(el.scrollHeight+2)+"px";}
document.addEventListener("input",e=>autoGrow(e.target),true);
const growAll=root=>requestAnimationFrame(()=>(root||document).querySelectorAll("textarea").forEach(autoGrow));
function openPanel(html,kind=""){
  if(!kind)kind=/^\s*<h2>Menü<\/h2>/.test(html)?"menu":/^\s*<h2>Punkte \(/.test(html)?"list":"";
  const open=isPanelOpen();
  if(PARENTS[kind]){panelBack=null;}
  else if(open&&PARENTS[panelKind]){[panelBackLbl,panelBack]=PARENTS[panelKind];}
  else if(!(open&&panelBack)){panelBack=null;}
  panelKind=kind;
  $("#panel").innerHTML=`<div class="ptop">${panelBack?`<button class="pback" id="pBack">${panelBackLbl}</button>`:"<span></span>"}<span class="pgrab"></span><button class="px" id="pX" aria-label="Schliessen">✕</button></div>`+html;
  $("#sheet").classList.add("open");$("#panel").scrollTop=0;
  $("#pX").onclick=closePanel;const b=$("#pBack");if(b)b.onclick=panelBack;growAll($("#panel"));
  if(!panelHist){try{history.pushState({rbPanel:1},"");panelHist=true;}catch(e){}}}
const isPanelOpen=()=>$("#sheet").classList.contains("open");
function hidePanel(){$("#sheet").classList.remove("open");panelKind="";panelBack=null;}
let ignorePop=false;
function closePanel(){if(!isPanelOpen())return;hidePanel();if(panelHist){panelHist=false;ignorePop=true;try{history.back();}catch(e){ignorePop=false;}}}
/* Überlagerungen (Fotovorschau, «Neue Punkte aus Fotos»): Zurück-Taste schliesst nur die oberste Ebene */
const ovl=[];
function ovlPush(close){try{history.pushState({rbOvl:1},"");}catch(e){}ovl.push(close);}
function ovlClose(){if(ovl.length){try{history.back();}catch(e){ovl.pop()();}}}
function showBig(src){const u=URL.createObjectURL(src);const w=document.createElement("div");w.className="pbig";w.innerHTML=`<img src="${u}"><button class="pbx" aria-label="Schliessen">✕</button>`;
  document.body.appendChild(w);ovlPush(()=>{URL.revokeObjectURL(u);w.remove();});w.onclick=e=>{e.stopPropagation();ovlClose();};}
window.addEventListener("popstate",()=>{if(ovl.length){ovl.pop()();return;}if(ignorePop){ignorePop=false;return;}if(panelHist||isPanelOpen()){panelHist=false;hidePanel();}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&isPanelOpen())closePanel();});
/* Klick neben das Fenster schliesst es – aber nur, wenn auch das Drücken daneben begann (nicht beim Markieren von Text, das über den Rand hinausgeht)
   und nie bei einem Formular mit Eingaben (Punkt bearbeiten), damit nichts verloren geht */

/* ---------- Von Google Maps übernehmen: Teilen-Ziel und Google-Takeout-Import ---------- */
function guessCat(t){t=(t||"").toLowerCase();
  if(/camping|campsite|camp\b|caravan|wohnmobil|aire de|stellplatz/.test(t))return "camp";
  if(/afriquia|shell|total|petrom|ziz|winxo|station[- ]service|tankstelle|gas station|fuel/.test(t))return "fuel";
  if(/marjane|carrefour|bim\b|aswak|supermar|épicerie|hanout|supermarket|lidl|aldi|migros|coop/.test(t))return "shop";
  if(/garage|mécani|mecani|pneu|vulcan|werkstatt|repair|auto parts/.test(t))return "service";
  if(/source|fontaine|brunnen|water|eau potable/.test(t))return "water";
  if(/trail|randonn|wander|hike|gorge|sommet|peak/.test(t))return "hike";
  return "sight";}
function coordsFromUrl(u){if(!u)return null;let m;
  if((m=u.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)))return [+m[1],+m[2]];
  if((m=u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)))return [+m[1],+m[2]];
  if((m=u.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i)))return [+m[1],+m[2]];
  if((m=u.match(/\/search\/(-?\d+\.\d+),\+?(-?\d+\.\d+)/)))return [+m[1],+m[2]];
  return null;}
async function geocode(q){if(!q||!navigator.onLine)return null;
  try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=de&q=${encodeURIComponent(q)}`);const j=await r.json();
    return j[0]?[+j[0].lat,+j[0].lon]:null;}catch(e){return null;}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* Google Plus Codes (Open Location Code), z. B. «8C6Q+XX Zagora» – Google teilt unbenannte Orte oft so */
const OLC_A="23456789CFGHJMPQRVWX";
function olcDecode(code){code=code.toUpperCase().replace("+","").replace(/0+$/,"");let la=-90,lo=-180,r=20;
  for(let i=0;i<Math.min(code.length,10);i+=2){la+=OLC_A.indexOf(code[i])*r;if(code[i+1])lo+=OLC_A.indexOf(code[i+1])*r;if(i+2<Math.min(code.length,10))r/=20;}
  return [la+r/2,lo+r/2];}
function olcEncode(lat,lon){lat=Math.min(89.9999,Math.max(-90,lat))+90;lon=((lon+180)%360+360)%360;let c="",r=20;
  for(let i=0;i<5;i++){const a=Math.floor(lat/r),b=Math.floor(lon/r);c+=OLC_A[a]+OLC_A[b];lat-=a*r;lon-=b*r;r/=20;if(i===3)c+="+";}return c;}
function olcRecover(short,ref){short=short.toUpperCase();const pad=8-short.indexOf("+");if(pad<=0)return olcDecode(short);
  const res=Math.pow(20,2-pad/2),h=res/2;let [la,lo]=olcDecode(olcEncode(ref[0],ref[1]).replace("+","").slice(0,pad)+short.replace("+",""));
  if(ref[0]+h<la&&la-res>=-90)la-=res;else if(ref[0]-h>la&&la+res<=90)la+=res;
  if(ref[1]+h<lo)lo-=res;else if(ref[1]-h>lo)lo+=res;return [la,lo];}
async function plusCodeLoc(text){const m=(text||"").match(/(?:^|[\s,(])([23456789CFGHJMPQRVWX]{2,8}\+[23456789CFGHJMPQRVWX]{0,3})(?=[\s,)]|$)([^\n]*)/i);if(!m)return null;
  const code=m[1].toUpperCase();if(code.indexOf("+")===8)return olcDecode(code);
  const loc=(m[2]||"").replace(/^[\s,]+/,"").trim();const ref=loc?await geocode(loc)||await geocode(loc.split(",")[0]):map.getCenter()&&[map.getCenter().lat,map.getCenter().lng];
  return ref?olcRecover(code,ref):null;}
/* 1. Teilen aus Google Maps (oder jeder anderen App) an ibexmap */
async function handleShare(){const q=new URLSearchParams(location.search);if(!q.has("st")&&!q.has("sx")&&!q.has("su"))return;
  history.replaceState(null,"",location.pathname);
  const title=(q.get("st")||"").trim(),text=(q.get("sx")||"").trim();let url=(q.get("su")||"").trim();
  const um=text.match(/https?:\/\/\S+/);if(!url&&um)url=um[0];
  const lines=text.replace(/https?:\/\/\S+/g,"").split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const name=(title&&!/^https?:/.test(title)?title:lines[0])||"Geteilter Ort";const addr=lines.filter(x=>x!==name).join(", ");
  placeExtra={title:name,desc:addr,source:url,cat:guessCat(name+" "+addr),status:"idee"};
  let ll=coordsFromUrl(url)||coordsFromUrl(text);
  let approx=false;
  if(!ll){toast("Suche den Ort …",4000);ll=await plusCodeLoc(text+"\n"+title)||await geocode([name,addr].filter(Boolean).join(", "))||await geocode(addr)||await geocode(name);}
  /* zuletzt: nur Ort/Region aus der Adresse (z. B. «Zagora, Marokko») – dann ungefähr */
  if(!ll&&addr){const parts=addr.split(",").map(x=>x.trim()).filter(Boolean);for(let i=1;i<parts.length&&!ll;i++){ll=await geocode(parts.slice(i).join(", "));if(ll)approx=true;}}
  if(!ll&&name){const w=name.split(/\s+/).filter(x=>x.length>3);for(const x of w.reverse()){ll=await geocode(x);if(ll){approx=true;break;}}}
  setPlacing(false);setPlacing(true);
  if(ll&&!approx){map.setView(ll,16);putCross(L.latLng(ll[0],ll[1]));toast(`«${name}» – Position prüfen, dann «Punkt hier setzen»`,6000);}
  else if(ll){map.setView(ll,13);putCross(L.latLng(ll[0],ll[1]));toast(`«${name}»: nur der Ort wurde gefunden – Kreuz an die genaue Stelle ziehen`,8000);}
  else{putCross(map.getCenter());toast("Ort nicht automatisch gefunden – Kreuz an die richtige Stelle ziehen. Tipp: in Google Maps die Koordinaten kopieren und in der Suche einfügen.",9000);}}
/* 3. Google Takeout: «Gespeicherte Orte.json» (GeoJSON) oder Listen als .csv */
function parseCSV(t){const rows=[];let row=[],f="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===","){row.push(f);f="";}else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(f);rows.push(row);row=[];f="";}else f+=c;}
  if(f||row.length){row.push(f);rows.push(row);}return rows.filter(r=>r.some(x=>x.trim()));}
async function importGoogle(items,label){
  const known=new Set(points.map(p=>p.source).filter(Boolean));
  const todo=items.filter(x=>!(x.url&&known.has(x.url)));const skipped=items.length-todo.length;
  const needGeo=todo.filter(x=>!x.ll).length;
  confirmBox(`${todo.length} Orte aus ${esc(label)} in die Reise «${esc(curTripObj().name)}» übernehmen?${skipped?`<br>${skipped} sind schon vorhanden.`:""}${needGeo?`<br>${needGeo} ohne Koordinaten werden über OpenStreetMap gesucht (ca. ${needGeo} Sekunden, braucht Internet).`:""}`,async()=>{
    let n=0,miss=[];
    for(let i=0;i<todo.length;i++){const x=todo[i];let ll=x.ll;
      if(!ll){toast(`Suche Orte … (${i+1}/${todo.length})`,60000);ll=await geocode([x.name,x.addr].filter(Boolean).join(", "))||(x.addr?await geocode(x.addr):null);await sleep(1100);}
      if(!ll){miss.push(x.name);continue;}
      await put("points",newPoint(+(+ll[0]).toFixed(6),+(+ll[1]).toFixed(6),{title:x.name||"",desc:[x.addr,x.note].filter(Boolean).join("\n"),source:x.url||"",cat:guessCat((x.name||"")+" "+(x.addr||"")),status:"idee"}));n++;}

    else toast(`${n} Orte übernommen`,5000);});}
function googleFromGeoJSON(fc){return (fc.features||[]).map(f=>{const P=f.properties||{},L0=P.location||P.Location||{};const g=f.geometry&&f.geometry.coordinates;
  let ll=g&&g.length>=2&&(g[0]||g[1])?[g[1],g[0]]:null;const url=P.google_maps_url||P["Google Maps URL"]||"";if(!ll)ll=coordsFromUrl(url);
  return {name:L0.name||L0["Business Name"]||P.Title||P.name||"",addr:L0.address||L0.Address||P.address||"",note:P.Comment||P.comment||"",url,ll};}).filter(x=>x.name||x.ll);}
function googleFromCSV(t){const rows=parseCSV(t);if(rows.length<2)return [];const h=rows[0].map(x=>x.trim().toLowerCase());
  const ix=k=>h.findIndex(x=>k.includes(x));const iT=ix(["title","titel","name"]),iN=ix(["note","notiz","comment","kommentar"]),iU=ix(["url"]);
  return rows.slice(1).map(r=>{const url=iU>=0?r[iU]:"";return {name:iT>=0?r[iT]:"",note:iN>=0?r[iN]:"",url,addr:"",ll:coordsFromUrl(url)};}).filter(x=>x.name);}

     :`<p class="muted">Orte wie Supermarkt, Tankstelle, Werkstatt, Wasser, Camping, Restaurant … als Overlay auf der Karte – auch offline. Zuerst ein Land laden.${osmData.items.length?" (Der frühere «Versorgung»-Download ist hier aufgegangen – bitte das Land einmal neu laden.)":""}</p><div class="actions"><button class="btn sec" id="pgMan">Orte für ein Land laden …</button></div>`}

  $("#mfSupply").onclick=()=>{poiShow=["1","6","8"];try{localStorage.setItem("rb_poishow",JSON.stringify(poiShow));}catch(e){}drawOsm();only(["shop","fuel","service","water"]);
    if(!poiOff.length)toast("Für das POI-Overlay zuerst ein Land laden (Filter › POI-Overlay)",4500);};
  $("#mfNight").onclick=()=>only(["wild","camp"]);
  $("#mfClose").onclick=closePanel;
  $("#panel").querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{const k=b.dataset.pg;poiShow=poiShow.includes(k)?poiShow.filter(x=>x!==k):[...poiShow,k];try{localStorage.setItem("rb_poishow",JSON.stringify(poiShow));}catch(e){}drawOsm();
    if(poiShow.includes(k)&&map.getZoom()<OSM_MINZOOM)toast("Näher hineinzoomen, dann erscheinen die Orte",3500);const sc=$("#panel").scrollTop;showMapFilter();$("#panel").scrollTop=sc;});
  {const pm=$("#pgMan");if(pm)pm.onclick=poiOffDialog;}
  const tg=(A,v)=>{if(!v)return [];return A.includes(v)?A.filter(x=>x!==v):[...A,v];};const keep=()=>{const sc=$("#panel").scrollTop;showMapFilter();$("#panel").scrollTop=sc;};

  $("#panel").querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{const k=b.dataset.st;hiddenStat=hiddenStat.includes(k)?hiddenStat.filter(x=>x!==k):[...hiddenStat,k];
    try{localStorage.setItem("rb_hidstat",JSON.stringify(hiddenStat));}catch(e){}drawPoints();showMapFilter();});
  $("#panel").querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const k=b.dataset.o;osmShow=osmShow.includes(k)?osmShow.filter(x=>x!==k):[...osmShow,k];saveOsmShow();drawOsm();

  const oma=$("#oMA");if(oma)oma.onclick=async()=>{const cc=osmCC();if(await osmLoad(cc,countryName(cc)))showMapFilter();};
  const ov=$("#oView");if(ov)ov.onclick=async()=>{if(map.getZoom()<8)return toast("Bitte zuerst näher hineinzoomen (Ausschnitt zu gross)",4000);
    const b=map.getBounds();if(await osmLoad(`${b.getSouth().toFixed(4)},${b.getWest().toFixed(4)},${b.getNorth().toFixed(4)},${b.getEast().toFixed(4)}`,osmData.scope||"Kartenausschnitt"))showMapFilter();};
}

  let imgs="";for(const ph of p.photos||[]){const u=await photoURL(ph);if(u)imgs+=`<img class="big" src="${u}">`;}

  openPanel(`<div class="detail">
    <h2 class="dtitle">${esc(ptTitle(p))}</h2>
    <div class="meta">
      <div class="mrow">${icoBadge(p.cat in CATS?p.cat:"other",c.c,24)}<span><b>${esc(c.n)}</b>${p.cat==="water"&&p.water==="trink"?" (Trinkwasser)":p.cat==="water"&&p.water==="brauch"?" (Brauchwasser)":""} · ${p.status==="besucht"?`<span class="lchk">✓</span>`:""}${esc(STATUS[p.status]||"")}</span></div>
      ${p.section?`<div class="mrow">${mi("sec")}<span>${esc(p.section)}</span></div>`:""}

      ${p.trip&&tripName(p.trip)?`<div class="mrow">${mi("route")}<span>${esc(tripName(p.trip))}</span></div>`:""}
      <div class="mrow">${mi("globe")}<span>${esc(countryName(p.country)||"Land unbekannt")}</span></div>
      ${me?`<div class="mrow">${mi("ruler")}<span>${distKm(me,p).toFixed(1)} km Luftlinie</span></div>`:""}
      ${p.cat==="water"?`<div class="mrow">${icoBadge("water","#0288d1",24)}<span><b>${esc(WATERQ[p.water||"unklar"])}</b></span></div>`:""}
      ${p.imp?`<div class="mrow"><span class="vimp" style="position:static;display:inline-block;width:22px;height:22px;line-height:18px">!</span><span><b>Wichtig</b></span></div>`:""}
      ${p.story?`<div class="mrow"><span class="lstory" style="width:22px;height:22px;margin:0">${storyI(13)}</span><span>Storypoint – wird publiziert</span></div>`:""}
    </div>
    ${RATE[p.cat]&&(p.stars||Object.keys(p.rate||{}).length)?`<div class="rate">${p.stars?`<div class="rrow"><b>Gesamt</b><span class="sv" style="font-size:20px">${starTxt(p.stars)}</span></div>`:""}
      ${RATE[p.cat].map(([k,l,ty])=>{const v=(p.rate||{})[k];if(ty)return isOn(v)?`<div class="rrow"><b>${icoBadge("lake","#0288d1",22)} ${l}</b><span>✓</span></div>${v.t?`<div class="muted">${esc(v.t)}</div>`:""}`:"";return v&&(v.s||v.t)?`<div class="rrow"><b>${l}</b><span class="sv">${starTxt(v.s)}</span></div>${v.t?`<div class="muted">${esc(v.t)}</div>`:""}`:"";}).join("")}</div>`:""}
    <hr>${imgs}
    ${p.desc?`<div class="desc">${esc(p.desc)}</div>`:""}
    ${p.note?`<label>Notiz unterwegs</label><div class="desc">${esc(p.note)}</div>`:""}
    ${p.source?`<label>Quelle</label><div class="desc src">${linkify(p.source)}</div>`:""}
    <div class="muted" style="margin-top:10px">${p.lat.toFixed(5)}, ${p.lon.toFixed(5)}</div>
    <div class="actions">
      <a class="btn or" href="geo:${p.lat},${p.lon}?q=${p.lat},${p.lon}(${encodeURIComponent(ptTitle(p))})">Navigieren (OsmAnd)</a>
      <button class="btn sec" id="dShow">Auf Karte</button>
      <button class="btn sec" id="dEdit">Bearbeiten</button>
      ${p.status!=="besucht"?`<button class="btn sec" id="dVisited">Als besucht markieren</button>`:""}
    </div></div>`);

  $("#dEdit").onclick=()=>editPoint(p);
  const v=$("#dVisited");if(v)v.onclick=async()=>{p.status="besucht";p.visited=new Date().toISOString().slice(0,10);p.updated=Date.now();await put("points",p);await loadPoints();showDetail(p.id);};

/* ---------- Bearbeiten ---------- */
let draftPhotos=[];
async function editPoint(p,isNew=false){await loadGeo();
  draftPhotos=[...(p.photos||[])];
  const catOpts=Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${p.cat===k?"selected":""}>${v.i} ${v.n}</option>`).join("");
  const stOpts=Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${p.status===k?"selected":""}>${v}</option>`).join("");

   <label>Titel <span class="muted">(freiwillig)</span></label><input id="fTitle" value="${esc(p.title)}" placeholder="leer = automatisch, z. B. ${esc(ptTitle(Object.assign({},p,{title:""})))}">

   <select id="fCat" style="display:none">${catOpts}</select>

     <div id="fToWrap"><label>Bis</label><input id="fVisTo" type="date" value="${esc(p.visitedTo||"")}"></div></div><div class="muted" id="fNights" style="margin-top:4px"></div></div>
   <div class="row"><div><label>Reise</label><select id="fTrip">${tripsSorted().map(t=>`<option value="${t.id}" ${(p.trip||curTrip)===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}<option value="">– keine Reise –</option></select></div>
   <div><label>Abschnitt</label><select id="fSection">${secOpts(p.trip||curTrip,p.section)}</select></div></div>
   <input id="fSectionNew" placeholder="Name des neuen Abschnitts" style="display:none;margin-top:6px">
   <label>Land (automatisch)</label><div class="muted">${esc(countryName(p.country||countryOf(p.lat,p.lon))||(countryData?"–":"Ländergrenzen noch nicht geladen"))}</div>
   <div id="fWaterWrap" style="display:${p.cat==="water"?"block":"none"}"><label>Wasser</label><select id="fWater">${Object.entries(WATERQ).map(([k,v])=>`<option value="${k}" ${(p.water||"unklar")===k?"selected":""}>${v}</option>`).join("")}</select></div>
   <div id="fRateBox"></div>
   <label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);margin-top:14px"><input type="checkbox" id="fImp" style="width:auto;margin:0" ${p.imp?"checked":""}> <span class="vimp" style="position:static;display:inline-block">!</span> Wichtig – auf der Karte hervorheben</label>
   <label style="display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);margin-top:14px"><input type="checkbox" id="fStory" style="width:auto;margin:0" ${p.story?"checked":""}> ${mi("book",16)} Storypoint – auf der Familienseite zeigen</label>
   <textarea id="fStoryText" placeholder="Story-Text (für die Familienseite)" style="min-height:70px;margin-top:6px">${esc(p.storyText||"")}</textarea><div class="muted" id="fStoryHint" style="font-size:12px;margin-top:2px">${p.story?"Wird beim Veröffentlichen geteilt.":"Wird nicht geteilt – der Text bleibt gespeichert."}</div>
   <label>Beschreibung</label><textarea id="fDesc">${esc(p.desc)}</textarea>
   <label>Notiz unterwegs</label><textarea id="fNote" style="min-height:70px">${esc(p.note)}</textarea>
   <label>Fotos</label><div class="photos" id="fPhotos"></div>
   <div class="drop" id="fDrop">Foto aufnehmen oder auswählen<br><span style="font-size:12px">am PC: Bild hierher ziehen oder mit Ctrl+V einfügen</span>
     <div class="actions" style="justify-content:center;margin-top:8px">
       <label class="btn sec" style="margin:0">${mi("photo",16)} Kamera<input type="file" accept="image/*" capture="environment" id="fCam" hidden></label>
       <label class="btn sec" style="margin:0">${mi("upload",16)} Galerie / Datei<input type="file" accept="image/*" multiple id="fGal" hidden></label>
     </div></div>
   <details class="more" ${p.source?"open":""}><summary>Mehr: Quelle und Koordinaten</summary>
   <label>Quelle</label><input id="fSource" value="${esc(p.source)}" placeholder="Reiseführer S. …, Webseite …">
   <div class="row"><div><label>Breite</label><input id="fLat" inputmode="decimal" title="Auch «Breite, Länge» oder einen Google-Maps-Link einfügen" value="${p.lat}"></div><div><label>Länge</label><input id="fLon" inputmode="decimal" value="${p.lon}"></div></div></details>
   <div class="actions"><button class="btn" id="fSave">Speichern</button><button class="btn sec" id="fCancel">Abbrechen</button>
   ${isNew?"":`<button class="btn warn" id="fDel">Löschen</button>`}</div>`);
  await renderDraftPhotos();
  const draftRate=JSON.parse(JSON.stringify(p.rate||{}));let draftStars=p.stars||0;
  const readRate=()=>{const box=$("#fRateBox");const g=box.querySelector('[data-name="__all"]');if(g)draftStars=+g.dataset.v;
    box.querySelectorAll(".stars[data-name]").forEach(w=>{const k=w.dataset.name;if(k==="__all")return;draftRate[k]=Object.assign(draftRate[k]||{},{s:+w.dataset.v});});
    box.querySelectorAll("input[data-tog]").forEach(i=>{const k=i.dataset.tog;draftRate[k]=Object.assign(draftRate[k]||{},{b:i.checked,s:0});});
    box.querySelectorAll("input[data-note]").forEach(i=>{const k=i.dataset.note;draftRate[k]=Object.assign(draftRate[k]||{},{t:i.value.trim()});});};
  const renderRate=()=>{const cr=RATE[$("#fCat").value],box=$("#fRateBox");
    if(!cr){box.innerHTML="";return;}
    box.innerHTML=`<label>Bewertung</label><div class="rate"><div class="rrow"><b>Gesamt</b>${starsWidget("__all",draftStars)}</div>
      ${cr.map(([k,l,ty])=>ty?`<label class="rrow" style="justify-content:flex-start;gap:10px;font-size:14px;color:var(--ink);margin-top:10px"><input type="checkbox" data-tog="${k}" style="width:auto;margin:0" ${isOn(draftRate[k])?"checked":""}> ${icoBadge("lake","#0288d1",24)} <b>${l}</b></label><input data-note="${k}" placeholder="Notiz zu ${l} (optional, z. B. Fluss, See, Meer)" value="${esc((draftRate[k]||{}).t||"")}">`
        :`<div class="rrow"><b>${l}</b>${starsWidget(k,(draftRate[k]||{}).s)}</div><input data-note="${k}" placeholder="Notiz zu ${l} (optional)" value="${esc((draftRate[k]||{}).t||"")}">`).join("")}

  renderRate();
  $("#fCatGrid").querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{$("#fCatGrid").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
    $("#fCat").value=b.dataset.cat;$("#fCat").dispatchEvent(new Event("change"));});
  $("#fCat").onchange=()=>{readRate();renderRate();$("#fWaterWrap").style.display=$("#fCat").value==="water"?"block":"none";};
  $("#fStatus").addEventListener("change",e=>{$("#fVisWrap").style.display=e.target.value==="besucht"?"block":"none";});
  const updStay=()=>{const st=STAY.includes($("#fCat").value);$("#fVisLbl").textContent=st?"Von":"Besucht am";$("#fToWrap").style.display=st?"":"none";
    const v=$("#fVisited").value,t=$("#fVisTo").value;$("#fVisTo").min=v||"";const n=st?nights(v,t):0;
    $("#fNights").textContent=!st?"":t&&n<0?"«Bis» liegt vor «Von»":n>0?`${n} ${n==1?"Nacht":"Nächte"}`:"«Bis» leer lassen bei nur einer Nacht";};
  $("#fVisited").addEventListener("change",updStay);$("#fVisTo").addEventListener("change",updStay);$("#fCat").addEventListener("change",updStay);updStay();
  $("#fStory").onchange=e=>{$("#fStoryHint").textContent=e.target.checked?"Wird beim Veröffentlichen geteilt.":"Wird nicht geteilt – der Text bleibt gespeichert.";};
  $("#fTrip").onchange=e=>{$("#fSection").innerHTML=secOpts(e.target.value,"");$("#fSectionNew").style.display="none";};
  $("#fSection").onchange=e=>{$("#fSectionNew").style.display=e.target.value==="__new"?"block":"none";if(e.target.value==="__new")$("#fSectionNew").focus();};
  /* «30.3387, -5.8430» oder ein Google-Maps-Link in eines der Felder eingefügt: beide Felder auf einmal füllen */
  const both=e=>{const v=e.target.value;if(/[,;\s].*\d|https?:/.test(v.trim())){const r=parseLoc(v);if(r&&r.ll){$("#fLat").value=+r.ll[0].toFixed(7);$("#fLon").value=+r.ll[1].toFixed(7);toast("Breite und Länge übernommen",2500);}}};
  $("#fLat").oninput=both;$("#fLon").oninput=both;
  const addFiles=async files=>{for(const f of files){if(!f.type.startsWith("image/"))continue;
      try{const b=await resize(f);const id=uid();await put("photos",{id,blob:b});draftPhotos.push(id);}catch(e){toast(e.message);}}
    renderDraftPhotos();};
  $("#fCam").onchange=e=>addFiles(e.target.files);
  $("#fGal").onchange=e=>addFiles(e.target.files);
  const dr=$("#fDrop");
  dr.ondragover=e=>{e.preventDefault();dr.classList.add("over");};
  dr.ondragleave=()=>dr.classList.remove("over");

  $("#panel").onpaste=e=>{const fs=[...(e.clipboardData?.items||[])].filter(i=>i.type.startsWith("image/")).map(i=>i.getAsFile());if(fs.length){e.preventDefault();addFiles(fs);}};
  $("#fCancel").onclick=async()=>{ if(isNew){for(const id of draftPhotos)await del("photos",id);} else {for(const id of draftPhotos)if(!(p.photos||[]).includes(id))await del("photos",id);} closePanel();};

    const lat=parseFloat($("#fLat").value.replace(",",".")),lon=parseFloat($("#fLon").value.replace(",","."));

    {const rm=(p.photos||[]).filter(id=>!draftPhotos.includes(id));for(const id of rm)await del("photos",id);
     if(rm.length)p.photoDel=[...new Set([...(p.photoDel||[]),...rm])];}
    const tr=$("#fTrip").value;let sec=$("#fSection").value;if(sec==="__new")sec=await addSection($("#fSectionNew").value,tr);

async function renderItems(){await loadGeo();
  const q=fText.toLowerCase();
  const inS=(S,v)=>!S.size||S.has(v);
  let list=points.filter(p=>(!LF.trip.size||LF.trip.has(p.trip||"__none"))&&(LF.trip.has(p.trip)||!tripHidden(p.trip))&&inS(LF.cc,p.country)&&inS(LF.cat,p.cat in CATS?p.cat:"other")&&inS(LF.st,p.status||"idee")&&inS(LF.sec,p.section)&&(!LF.stars.size||(p.stars||0)>=Math.min(...[...LF.stars].map(Number)))&&(!q||(ptTitle(p)+" "+p.desc+" "+p.section+" "+countryName(p.country)+" "+tripName(p.trip)+" "+p.note).toLowerCase().includes(q)));
  const dkey=p=>p.visited?new Date(p.visited+"T12:00:00").getTime():(p.created||0);
  const rp=refPos();
  if(lSort==="dist")list=list.map(p=>({p,d:distKm(rp,p)})).sort((a,b)=>a.d-b.d).map(x=>x.p);
  else if(lSort==="new")list.sort((a,b)=>dkey(b)-dkey(a));
  else if(lSort==="old")list.sort((a,b)=>dkey(a)-dkey(b));
  else if(lSort==="stars")list.sort((a,b)=>(b.stars||0)-(a.stars||0)||dkey(b)-dkey(a));
  let h=lSort==="dist"&&list.length?`<p class="muted" style="font-size:13px;margin:4px 0 8px">Nächste zuerst – ab ${esc(rp.src)}</p>`:"";
  for(const p of list){const c=CATS[p.cat]||CATS.other;const u=p.photos?.length?await photoURL(p.photos[0]):"";
    h+=`<div class="item" data-id="${p.id}">${u?`<img src="${u}">`:`<div class="noimg" style="background:${c.c}">${svgI(p.cat in CATS?p.cat:"other",34)}</div>`}
      <div><div class="t">${p.status==="besucht"?`<span class="lchk">✓</span>`:""}${p.story?`<span class="lstory">${storyI(10)}</span>`:""}${esc(ptTitle(p))}${p.stars&&RATE[p.cat]?` <span class="sv" style="font-weight:400;font-size:13px">${starTxt(p.stars)}</span>`:""}</div><div class="s"><span class="dot" style="background:${c.c}"></span>${esc(c.n)} · ${esc(STATUS[p.status]||"")}${p.section?" · "+esc(p.section):""} · ${esc(fmtD(p.visited||p.created))}${" · "+distKm(rp,p).toFixed(0)+" km"}</div></div></div>`;}
  $("#lItems").innerHTML=h||`<p class="muted">Keine Punkte gefunden.</p>`;

}

function tileXY(lat,lon,z){const n=2**z,r=lat*Math.PI/180;
  return [Math.max(0,Math.min(n-1,Math.floor((lon+180)/360*n))),Math.max(0,Math.min(n-1,Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n)))];}
function tileKeys(areas,zmin,zmax){const set=new Set();
  for(const a of areas)for(let z=zmin;z<=zmax;z++){const[x1,y1]=tileXY(a.n,a.w,z),[x2,y2]=tileXY(a.s,a.e,z);

/* Land in Kacheln zerlegen, die das Land berühren (statt eines grossen Rechtecks) */
function countryAreas(cc){const f=(countryData||[]).find(x=>x.c===cc);if(!f)return [];
  const [w,s0,e,n]=f.b,span=Math.max(e-w,n-s0),T=span>8?0.5:span>3?0.25:0.1,out=[];
  const hit=(la,lo)=>{for(let i=0;i<=4;i++)for(let j=0;j<=4;j++)if(inGeom(lo+T*j/4,la+T*i/4,f.g))return true;return false;};
  for(let la=Math.floor(s0/T)*T;la<n;la+=T)for(let lo=Math.floor(w/T)*T;lo<e;lo+=T)if(hit(la,lo))out.push({s:+la.toFixed(3),w:+lo.toFixed(3),n:+(la+T).toFixed(3),e:+(lo+T).toFixed(3)});
  if(!out.length)out.push({s:s0,w,n,e});return out;}
/* grobe Schätzung ohne alle Kacheln aufzuzählen (für sehr grosse Länder) */
function tileEstimate(areas,lay){let t=0;const mz=layMaxZ(lay);for(const a of areas)for(let z=a.z1;z<=Math.min(a.z2,mz);z++){const[x1,y1]=tileXY(a.n,a.w,z),[x2,y2]=tileXY(a.s,a.e,z);t+=(x2-x1+1)*(y2-y1+1);}return t;}

     ${o.kind==="country"?`<label>Land</label><div style="display:flex;align-items:center;gap:10px;font-size:16px;margin:4px 0 2px"><b>${flagEmoji(o.cc)} ${esc(countryName(o.cc))}</b><button class="btn sec" id="cCC" style="padding:4px 12px;font-size:13px;min-height:0">Anderes Land</button></div>`:""}

/* ---------- Kartenpakete über Google Drive ----------
   Ein Gerät lädt die Kartenbilder einmal vom Kartendienst und legt sie gepackt auf Google Drive (pro Block max. 32×32 Bilder einer Stufe).
   Die anderen Geräte holen fehlende Bilder zuerst dort – in Minuten statt Stunden – und fragen nur den Rest beim Kartendienst an. */
const TL_SLUG={"Topo":"topo","Satellit":"sat","Strassen":"str","swisstopo (Schweiz)":"ch","Höhendaten":"dem"};
const tlBlock=k=>{const[z,x,y]=k.split("/").map(Number);const s=Math.min(5,z);return `${z}_${x>>s}_${y>>s}`;};
const tlName=(layer,b)=>`tiles_${TL_SLUG[layer]||"x"}_${b}.bin`;
const tlDrive=()=>{try{return JSON.parse(ls("rb_tldrive")||"{}");}catch(e){return {};}};
function tlDriveSet(files){const m={};files.forEach(f=>{if(/^tiles_[a-z]+_\d+_\d+_\d+\.bin$/.test(f.name))m[f.name]={id:f.id,n:+((f.appProperties||{}).n)||0,size:+f.size||0};});ls("rb_tldrive",JSON.stringify(m));return m;}
const tlShareOn=()=>{const v=ls("rb_tlshare");return v?v==="1":devGuess()==="PC";};
const gdOk=()=>!!(gdClient()&&gdToken&&Date.now()<gdExp-180000);
let offNoDrive=false;
async function tlFetch(id){const r=await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,{headers:{Authorization:"Bearer "+gdToken}});
  if(r.status===401)throw new Error("auth");if(!r.ok)throw new Error("Google Drive "+r.status);return r.arrayBuffer();}
function tlParse(buf){const hl=new DataView(buf).getUint32(0,true);const h=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,4,hl)));let off=4+hl;
  return h.t.map(([k,len,ty])=>{const s=off;off+=len;return {k,data:buf.slice(s,s+len),ty};});}
async function tlBuild(c,lay,keys){const head=[],parts=[];
  for(const k of keys){let r=null;try{r=await c.match(tileURL(lay,k));}catch(e){}if(!r)continue;const b=await r.blob();if(!b.size)continue;head.push([k,b.size,b.type||"image/png"]);parts.push(b);}
  if(!head.length)return null;const hj=new TextEncoder().encode(JSON.stringify({v:1,t:head}));const hl=new Uint8Array(4);new DataView(hl.buffer).setUint32(0,hj.length,true);
  return {blob:new Blob([hl,hj,...parts],{type:"application/octet-stream"}),n:head.length};}
/* grosse Dateien: «resumable» Upload (der normale Upload ist nur bis 5 MB vorgesehen) */
async function gdUploadBig(name,blob,id,props){
  const md=id?{appProperties:props}:{name,parents:["appDataFolder"],appProperties:props};
  const r=await fetch(`https://www.googleapis.com/upload/drive/v3/files${id?"/"+id:""}?uploadType=resumable`,{method:id?"PATCH":"POST",
    headers:{Authorization:"Bearer "+gdToken,"Content-Type":"application/json; charset=UTF-8","X-Upload-Content-Type":"application/octet-stream"},body:JSON.stringify(md)});
  if(r.status===401)throw new Error("auth");if(!r.ok)throw new Error("Google Drive "+r.status);
  const loc=r.headers.get("Location");
  if(!loc){if(blob.size<5e6)return gdUpload(name,blob,id,props);throw new Error("Google Drive: keine Upload-Adresse");}
  const r2=await fetch(loc,{method:"PUT",body:blob});if(r2.status===401)throw new Error("auth");if(!r2.ok)throw new Error("Google Drive "+r2.status);}
async function gdFree(){try{const q=(await(await fetch("https://www.googleapis.com/drive/v3/about?fields=storageQuota",{headers:{Authorization:"Bearer "+gdToken}})).json()).storageQuota;
  return q&&q.limit?(+q.limit-+q.usage):Infinity;}catch(e){return Infinity;}}
/* Anteil eines Gebiets, der als Kartenpaket auf Drive liegt (für die Übersicht) */
function tlDriveShare(pk){const tl=tlDrive();const lay=TSRC(pk.layer);if(!lay)return {pc:0,mb:0};const bl=new Set();packKeys(pk).forEach(k=>bl.add(tlBlock(k)));
  let have=0,mb=0;bl.forEach(b=>{const f=tl[tlName(pk.layer,b)];if(f){have++;mb+=f.size;}});return {pc:bl.size?Math.floor(have/bl.size*100):0,mb:Math.round(mb/1048576),blocks:bl.size,have};}

/* Herunterladen mit Fortschritt (läuft weiter, auch wenn das Fenster zu ist).
   Ablauf: 1. vorhandene Bilder prüfen · 2. fehlende von Google Drive · 3. Rest vom Kartendienst · 4. für die anderen Geräte auf Drive bereitstellen · 5. Strassenoberfläche · 6. POI */
async function offRunPack(pk,force){if(!navigator.onLine)return toast("Kein Internet",4000);if(offRun)return toast("Es läuft schon ein Download",3000);
  const noMap=!mapsHere();if(noMap&&!pk.surf&&!(pk.poi&&pk.cc))return toast("Auf diesem Gerät sind Karten ausgeschaltet (Offline-Daten › «Karten auf diesem Gerät»)",6000);
  /* Google-Anmeldung gilt ca. 1 Stunde: vorher erneuern – während des Downloads wird nie auf die Anmeldeseite gewechselt */
  if(!noMap&&gdClient()&&!gdOk()&&!offNoDrive){
    openPanel(`<h2>${esc(pk.name)}</h2><p>Für den <b>schnellen Weg über Google Drive</b> (Kartenpakete, die ein anderes Gerät schon geladen hat) ist eine frische Google-Anmeldung nötig.</p>
      <p class="muted">Nach der Anmeldung nochmals «Hier vervollständigen» bzw. «Fortsetzen» tippen.</p>

/* ---------- Rohdaten (Geofabrik, .osm.pbf) am PC auslesen: POI mit Details, Ortschaften, Strassenoberfläche – ohne Overpass ----------
   So machen es auch OsmAnd und Organic Maps: eine Datei pro Land statt tausender Server-Abfragen. Das Ergebnis geht über Google Drive an die anderen Geräte. */
const SURF_HW=["trunk","primary","secondary","tertiary","unclassified","road","track"];
const GEOFABRIK={MA:"africa/morocco",ES:"europe/spain",PT:"europe/portugal",FR:"europe/france",CH:"europe/switzerland",IT:"europe/italy",ME:"europe/montenegro",AL:"europe/albania",HR:"europe/croatia",BA:"europe/bosnia-herzegovina",GR:"europe/greece",AT:"europe/austria",DE:"europe/germany",SI:"europe/slovenia",DZ:"africa/algeria",TN:"africa/tunisia",MR:"africa/mauritania",SN:"africa/senegal",TR:"europe/turkey",NO:"europe/norway",SE:"europe/sweden",IS:"europe/iceland",GB:"europe/great-britain",IE:"europe/ireland-and-northern-ireland"};
function poiFirstConds(){const f=[],seen=new Set();POI_GROUPS.forEach(g=>g.items.forEach(it=>it[2].split(";").forEach(one=>{const m=one.match(/\["([^"]+)"(?:(=|~)"([^"]*)")?\]/);
  if(m){const key=m[1]+"|"+(m[2]||"")+"|"+(m[3]||"");if(!seen.has(key)){seen.add(key);f.push([m[1],m[2]||"=",m[3]||""]);}}})));return f;}
async function countryPackFor(cc){ls("rb_cchide",JSON.stringify(ccHidden().filter(c=>c!==cc)));ccGoneSet(cc,0);await loadOffPacks();let pk=offPacks.find(p=>p.kind==="country"&&p.cc===cc&&p.vec)||offPacks.find(p=>p.kind==="country"&&p.cc===cc);
  if(!pk){await loadGeo();const areas=countryAreas(cc).map(b=>Object.assign({},b,{z1:5,z2:12}));
    pk={id:uid(),name:countryName(cc),kind:"country",cc,layer:"keine",zmax:12,areas,date:Date.now(),surf:true,poi:true,vec:true,dem:true};offPacks.push(pk);}
  pk.surf=true;pk.poi=true;await saveOffPacks();return pk;}
async function pbfImportUI(cc,file){if(!/\.pbf$/i.test(file.name))return toast("Bitte die .osm.pbf-Datei wählen",4000);
  if(typeof DecompressionStream==="undefined")return toast("Dieser Browser kann die Rohdaten nicht lesen – bitte Chrome oder Edge verwenden",6000);
  const n=countryName(cc);const t0=Date.now();const stand=fileStamp(file);
  openPanel(`<h2>${esc(n)}: Rohdaten auslesen</h2><p class="muted">${esc(file.name)} · ${fmtN(Math.round(file.size/1048576))} MB · POI, Ortschaften und Strassenoberfläche – ohne OpenStreetMap-Server</p>
    <p id="pbPh" style="font-weight:600;margin:6px 0">Start …</p><div class="bar" style="height:14px"><div id="pbBar"></div></div><p id="pbTxt"></p>
    <p class="muted">Läuft nur am PC sinnvoll (braucht viel Arbeitsspeicher). App offen lassen.</p><div class="actions"><button class="btn sec" id="pbStop">Abbrechen</button></div>`);
  let wl=null;try{if("wakeLock" in navigator)wl=await navigator.wakeLock.request("screen");}catch(e){}
  const pk=await countryPackFor(cc);
  const w=new Worker(URL.createObjectURL(new Blob([$("#pbfWk").textContent],{type:"text/javascript"})));
  let q=Promise.resolve(),cellsN=0;const items=[],produced=new Set();let stopped=false;
  const set=(ph,f,txt)=>{const p=$("#pbPh");if(!p)return;p.textContent=ph;$("#pbBar").style.width=Math.round((f||0)*100)+"%";if(txt!=null)$("#pbTxt").textContent=txt;};
  $("#pbStop").onclick=()=>{stopped=true;w.terminate();set("Abgebrochen",0,"");try{if(wl)wl.release();}catch(e){}};
  const done=new Promise((res,rej)=>{w.onmessage=ev=>{const d=ev.data;
    if(d.t==="prog")set(d.phase,d.f,`${d.n!=null?fmtN(d.n)+" Strassen · ":""}${d.p!=null?fmtN(d.p)+" POI · ":""}${Math.round((Date.now()-t0)/1000)} s`);
    /* Felder speichern; kommt ein Feld in einer späteren Gruppe nochmals, werden die Strassen angehängt. Nicht im Arbeitsspeicher behalten. */
    else if(d.t==="surf")q=q.then(async()=>{for(const [k,ways] of Object.entries(d.cells)){let rec={id:"surf_"+k,ways,loaded:stand};
      if(produced.has(k)){try{const old=await getOne("meta","surf_"+k);if(old&&old.ways)rec.ways=old.ways.concat(ways);}catch(e){}}else{produced.add(k);cellsN++;}
      await put("meta",rec);surfMem.delete(k);}});
    else if(d.t==="poi"){for(const it of d.items){const m=[];POI_GROUPS.forEach((g,gi)=>g.items.forEach((x,ii)=>{try{if(poiSelOk(x[2],it.t))m.push(gi+"."+ii);}catch(e){}}));if(m.length){it.m=m;items.push(it);}}}
    else if(d.t==="part")q=q.then(()=>w.postMessage({t:"ack"}));
    else if(d.t==="done")res(d);else if(d.t==="err")rej(new Error(d.msg));};
    w.onerror=e=>rej(new Error((e&&e.message)||"Fehler beim Lesen"));});
  w.postMessage({file,poiFirst:poiFirstConds(),keep:POI_KEYS,hw:SURF_HW});
  let r;try{r=await done;}catch(e){w.terminate();try{if(wl)wl.release();}catch(x){}if(!stopped)set("Fehler: "+e.message,0,"Falls der Arbeitsspeicher nicht reicht: andere Programme schliessen und nochmals versuchen.");return;}
  w.terminate();set("Speichern …",1,"");await q;
  for(const k of packCells(pk))if(!produced.has(k)){const rec={id:"surf_"+k,ways:[],loaded:stand};await put("meta",rec);surfMem.delete(k);}
  await loadPoiOff();poiOff=poiOff.filter(p=>p.cc!==cc);poiOff.push({cc,loaded:stand,n:items.length,items});await savePoiOff();try{await del("meta","poipart_"+cc);}catch(e){}
  {const rd=rawDate();rd[cc]=stand;ls("rb_rawdate",JSON.stringify(rd));}
  offCntCache.clear();drawOsm();if(surfOn)drawSurf();
  const sum=`${fmtN(items.length)} POI und Ortschaften · Strassenoberfläche für ${fmtN(r.ways)} Strassen und Pisten · ${Math.round((Date.now()-t0)/1000)} s`;
  set("Fertig ✓",1,sum);
  /* für die anderen Geräte auf Google Drive */
  if(gdClient()){if(!gdOk()){$("#pbTxt").innerHTML=esc(sum)+`<br><span style="color:#9a4a00">Für die anderen Geräte: neu bei Google anmelden – der nächste Abgleich lädt es hoch.</span>`;}
    else{set("Für die anderen Geräte auf Google Drive …",1,sum);
      try{const files=await gdList();const f=files.find(x=>x.name===poiFile(cc));await poiToDrive(poiOff.find(p=>p.cc===cc),f&&f.id);poiDriveSet(await gdList());}catch(e){}
      try{await surfToDrive(pk);}catch(e){}
      set("Fertig ✓ – auch auf Google Drive",1,sum);}}
  try{if(wl)await wl.release();}catch(e){}
  setTimeout(()=>{if($("#pbPh"))offOverview();},4000);}
/* «Dateien laden»: Vektorkarte (.pmtiles) und Rohdaten (.osm.pbf) in einem Schritt */
async function landFilesUI(cc,files){
  const wrong=files.filter(f=>fileCC(f.name)&&fileCC(f.name)!==cc);if(wrong.length)return toast(`Falsches Land: ${wrong.map(f=>f.name).join(", ")} gehört nicht zu ${countryName(cc)}`,7000);
  const newest=l=>l.sort((a,b)=>fileStamp(b)-fileStamp(a))[0];
  const dem=newest(files.filter(f=>/^dem_.*\.pmtiles$/i.test(f.name))),vec=newest(files.filter(f=>/\.pmtiles$/i.test(f.name)&&!/^dem_/i.test(f.name))),pbf=newest(files.filter(f=>/\.pbf$/i.test(f.name)));
  if(!vec&&!pbf&&!dem)return toast(`Bitte die Dateien aus dem Ordner IbexMap-Karten wählen: vec_${cc}_….pmtiles, dem_${cc}_….pmtiles und ${cc}-rohdaten_….osm.pbf`,6000);
  if(vec)await vecImportUI(cc,vec,!!(pbf||dem));
  if(dem)await vecImportUI(cc,dem,!!pbf,"dem");
  if(pbf)await pbfImportUI(cc,pbf);}

const ccHidden=()=>{try{return JSON.parse(ls("rb_cchide")||"[]");}catch(e){return [];}};
/* ganzes Land von diesem Gerät entfernen: Kartenbilder, Höhendaten, Strassenoberfläche, POI, Vektorkarte; in der Übersicht ausblenden */
async function countryRemove(cc){await loadOffPacks();await loadPoiOff();const mine=offPacks.filter(p=>p.cc===cc&&p.kind==="country"),others=offPacks.filter(p=>!mine.includes(p));
  const keep=new Set();others.forEach(x=>{packURLs(x).forEach(u=>keep.add(u));if(x.dem&&x.kind==="country")packURLs(demPack(x)).forEach(u=>keep.add(u));});
  const c=await caches.open(OFFLINE);for(const pk of mine){for(const u of [...packURLs(pk),...packURLs(demPack(pk))]){try{if(!keep.has(u))await c.delete(u);}catch(e){}}if(pk.surf)await surfDeletePack(pk,others);}
  const hide=new Set(offHide());mine.forEach(p=>hide.add(p.id));offShared().filter(d=>d.cc===cc).forEach(d=>hide.add(d.id));ls("rb_offhide",JSON.stringify([...hide]));
  offPacks=others;await saveOffPacks();ls("rb_cchide",JSON.stringify([...new Set([...ccHidden(),cc])]));
  for(const k of ["vec","dem"]){const v=(await vecFiles(k))[cc];if(v){try{await(await opfs()).removeEntry(v.name);}catch(e){}}const m=vecMeta(k);delete m[cc];vecMetaSet(m,k);}
  poiOff=poiOff.filter(p=>p.cc!==cc);await savePoiOff();try{await del("meta","poipart_"+cc);}catch(e){}
  offCntCache.clear();drawOffAreas();drawOsm();await vecRefresh();}
/* Land überall entfernen: dieses Gerät, Google Drive (Vektorkarte, Höhendaten, POI, Strassenoberfläche) und – beim nächsten Abgleich – alle anderen Geräte */
async function countryRemoveAll(cc,onp){const ids=new Set([...offPacks,...offShared()].filter(d=>d.cc===cc).map(d=>d.id));
  const files=await gdList();const re=new RegExp(`^((vec|dem)_${cc}\\.pmtiles|poi_${cc}\\.json(\\.gz)?)$`);
  const del=files.filter(f=>re.test(f.name)||(/^surf_.+\.json(\.gz)?$/.test(f.name)&&ids.has(surfPid(f.name))));let err=0,i=0;
  for(const f of del){i++;if(onp)onp(i,del.length,f.name);try{await gd(`drive/v3/files/${f.id}`,{method:"DELETE"});}catch(e){err++;}}
  ccGoneSet(cc,1);await countryRemove(cc);
  try{const fl=await gdList();vecDriveSet(fl);poiDriveSet(fl);surfDriveSet(fl);}catch(e){}
  offSharedMerge();await syncDrive(true);return {n:del.length,mb:del.reduce((a,f)=>a+(+f.size||0),0)/1048576,err};}

const trkOn=()=>ls("rb_trk")==="1";
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};

async function loadTracks(){try{trks=await getAll("tracks");}catch(e){trks=[];}

   <div class="mgrp"><label class="mrow" style="cursor:pointer"><span class="mic">${mi("route",20)}</span><span class="mtx"><b>Fahrspur aufzeichnen</b><small>${trkOn()?"Ein":"Aus"}</small></span><input type="checkbox" id="tkOn" style="width:22px;height:22px" ${trkOn()?"checked":""}></label>
    <label class="mrow" style="cursor:pointer"><span class="mic">${mi("eye",20)}</span><span class="mtx"><b>Auf der Karte zeigen</b></span><input type="checkbox" id="tkShow" style="width:22px;height:22px" ${ls("rb_trkshow")!=="0"?"checked":""}></label></div>
   <div class="mgrp">${l.length?l.map(t=>`<button class="mrow" data-tk="${t.id}"><span class="mic">${mi("route",20)}</span><span class="mtx"><b>${fmtD(new Date(t.id+"T12:00"))}</b><small>${trkKm(t).toFixed(1)} km${t.trip?" · "+esc(tripName(t.trip)):""}</small></span><span class="mchev">${mi("chev",18)}</span></button>`).join(""):`<div class="mrow" style="cursor:default"><span class="mtx"><small>Noch keine Fahrspur aufgezeichnet.</small></span></div>`}</div>`);
  $("#tkOn").onchange=e=>{trkToggle(e.target.checked);tracksDialog();};
  $("#tkShow").onchange=e=>{ls("rb_trkshow",e.target.checked?"1":"0");drawTracks();};
  $("#panel").querySelectorAll("[data-tk]").forEach(b=>b.onclick=()=>{const t=trks.find(x=>x.id===b.dataset.tk);if(t&&t.pts.length){map.fitBounds(L.latLngBounds(t.pts.map(p=>[p[0],p[1]])),{padding:[30,30]});}showTrack(b.dataset.tk);});}
/* Abgleich der Fahrspuren: eine Datei pro Tag auf Google Drive; gleicher Tag von zwei Geräten wird zusammengeführt */
async function trkSync(files){const rem={};files.forEach(f=>{const m=f.name.match(/^trk_(\d{4}-\d\d-\d\d)\.json$/);if(m)rem[m[1]]={id:f.id,upd:+((f.appProperties||{}).upd)||0};});
  for(const [day,r] of Object.entries(rem)){const l=trks.find(t=>t.id===day);if(l&&(l.updated||0)>=r.upd)continue;
    try{const d=await(await gd(`drive/v3/files/${r.id}?alt=media`)).json();if(!d||!Array.isArray(d.pts))continue;
      let n;if(!l)n=d;else if(d.del&&(d.updated||0)>(l.updated||0))n=d;else{const m=new Map();[...l.pts,...d.pts].forEach(p=>m.set(p[2],p));n={...l,pts:[...m.values()].sort((a,b)=>a[2]-b[2]),updated:Math.max(l.updated||0,d.updated||0),del:false};}
      n.synced=n.updated;trks=trks.filter(t=>t.id!==day);trks.push(n);await put("tracks",n);}catch(e){}}
  for(const t of trks){const r=rem[t.id];if(r&&r.upd>=(t.updated||0))continue;if((t.synced||0)>=(t.updated||0)&&r)continue;
    try{await gdUpload(`trk_${t.id}.json`,new Blob([JSON.stringify({id:t.id,trip:t.trip,pts:t.pts,updated:t.updated,del:!!t.del})],{type:"application/json"}),r&&r.id,{upd:String(t.updated||0)});
      t.synced=t.updated;await put("tracks",t);}catch(e){}}
  drawTracks();}
/* ---------- Fahrmodus ----------
   Grosse Knöpfe für unterwegs: Karte folgt dem Standort, Bildschirm bleibt an, Punkt mit einem Tipp, Foto-Punkt, Fahne, Aufzeichnung. */
let driveOn=false,driveWL=null;
const QUICK=[["wild","Stellplatz"],["camp","Camping"],["water","Wasser"],["fuel","Tanken"],["shop","Einkauf"],["sight","Sehenswert"],["service","Auto"],["warn","Achtung"]];
function driveUI(){let bar=$("#driveBar");
  if(!driveOn){if(bar)bar.style.display="none";document.body.classList.remove("drive");return;}
  document.body.classList.add("drive");
  if(!bar){bar=document.createElement("div");bar.id="driveBar";$("#map").appendChild(bar);L.DomEvent.disableClickPropagation(bar);}
  bar.style.display="flex";
  bar.innerHTML=`<div class="dinfo" id="dInfo"></div>
    <div class="dbtns">
     <button class="dbtn main" id="dPt">${mi("pin",30)}<span>Punkt hier</span></button>
     <button class="dbtn" id="dPh">${mi("photo",28)}<span>Foto-Punkt</span></button>
     <button class="dbtn" id="dFl">${mi("flag",28)}<span>Fahne</span></button>
     <button class="dbtn ${trkOn()?"rec":""}" id="dRec"><svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="${trkOn()?4.5:3.5}" fill="${trkOn()?"#e53935":"currentColor"}"/></svg><span>${trkOn()?"Aufnahme ein":"Aufnahme aus"}</span></button>
     <button class="dbtn" id="dEnd"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg><span>Beenden</span></button></div>`;
  $("#dPt").onclick=()=>quickPoint(false);$("#dPh").onclick=()=>quickPoint(true);
  $("#dFl").onclick=()=>{if(!me)return toast("Noch keine GPS-Position",3000);addFlag(me.lat,me.lon,"");};
  $("#dRec").onclick=()=>trkToggle(!trkOn());$("#dEnd").onclick=()=>driveMode(false);driveInfo();}
let lastSpd=null;
function driveInfo(){const e=$("#dInfo");if(!e)return;const t=trks.find(x=>x.id===dayKey(Date.now()));
  e.innerHTML=`<span><b>${lastSpd!=null?Math.round(lastSpd*3.6):"–"}</b> km/h</span><span><b>${t&&!t.del?trkKm(t).toFixed(1):"0.0"}</b> km heute</span><span>${me?`GPS ±${Math.round(me.acc)} m`:"GPS sucht …"}</span>${trkOn()?`<span class="recdot">● Aufnahme</span>`:""}`;}
async function driveMode(on){driveOn=on;ls("rb_drive",on?"1":"0");
  if(on){closePanel();startGPS();follow=true;$("#locBtn").classList.add("follow");if(me)map.setView([me.lat,me.lon],Math.max(map.getZoom(),15));
    try{if("wakeLock" in navigator)driveWL=await navigator.wakeLock.request("screen");}catch(e){}}
  else{try{if(driveWL)await driveWL.release();}catch(e){}driveWL=null;}
  driveUI();}
document.addEventListener("visibilitychange",async()=>{if(driveOn&&document.visibilityState==="visible"&&!driveWL){try{driveWL=await navigator.wakeLock.request("screen");}catch(e){}}});
function quickPoint(photo){if(!me){toast("Noch keine GPS-Position – kurz warten",3500);startGPS();return;}
  const pos={lat:me.lat,lon:me.lon};
  openPanel(`<h2>${photo?"Foto-Punkt":"Punkt hier"}</h2><p class="muted">Am aktuellen Standort · Art antippen = gespeichert</p>
   <div class="qgrid">${QUICK.map(([k,n])=>`<button class="qbtn" data-q="${k}">${icoBadge(k,(CATS[k]||CATS.other).c,44)}<span>${n}</span></button>`).join("")}</div>
   <input type="file" id="qPh" accept="image/*" capture="environment" hidden>`);
  let pick=null;
  const save=async(cat,file)=>{const d=new Date();const p=newPoint(+pos.lat.toFixed(6),+pos.lon.toFixed(6),{title:`${(CATS[cat]||CATS.other).n} ${fmtDT(d)}`,cat,status:"besucht",visited:d.toISOString().slice(0,10)});
    if(file){try{const b=await resize(file);const id=uid();await put("photos",{id,blob:b});p.photos=[id];}catch(e){toast("Foto: "+e.message,4000);}}
    await put("points",p);await loadPoints();closePanel();toast(`${(CATS[cat]||CATS.other).n} gespeichert – Punkt antippen zum Ergänzen`,4000);};
  $("#panel").querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{pick=b.dataset.q;if(photo){$("#qPh").click();}else save(pick);});
  $("#qPh").onchange=e=>{const f=e.target.files[0];if(f&&pick)save(pick,f);};}

(async()=>{
  try{const n=performance.getEntriesByType("navigation")[0];if(n&&n.responseEnd)ST_MARKS.push({t:"App-Datei erhalten",s:n.responseEnd/1000});
    const lf=performance.getEntriesByType("resource").find(r=>/leaflet\.min\.js/.test(r.name));if(lf&&lf.responseEnd)ST_MARKS.push({t:"Kartenbibliothek erhalten",s:lf.responseEnd/1000});}catch(e){}
  stMark("Programm geladen");
  try{db=await openDB();}catch(e){toast("Speicher nicht verfügbar – Daten werden nicht gesichert",6000);return;}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  showSyncBtn();gdRestore();const _gdNew=gdFromRedirect();
  await loadMeta();
  if(ADM)admInit();
  await loadPoints();stMark(`Punkte (${points.length})`);
  /* letzte Kartenansicht steht schon; ohne gespeicherte Ansicht alle Punkte zeigen */
  if(!localStorage.getItem("rb_view")&&points.length){const b=L.latLngBounds(points.map(p=>[p.lat,p.lon]));map.fitBounds(b,{padding:[30,30]});}
  map.on("moveend",()=>{const c=map.getCenter();try{localStorage.setItem("rb_view",JSON.stringify({lat:+c.lat.toFixed(5),lon:+c.lng.toFixed(5),z:map.getZoom()}));}catch(e){}});
  showHeaderTrip();$("#ver").textContent=VERSION;
  await loadFlags();await loadTracks();wakeAcquire();if(surfOn&&!ADM)surfLayer.addTo(map);await loadOffPacks();drawOffAreas();
  if(!ADM)startGPS();
  if(!ADM&&ls("rb_drive")==="1")driveMode(true);
  $("#driveBtn").onclick=()=>driveMode(true);if(ADM)$("#driveBtn").style.display="none";nightApply();setInterval(nightApply,300000);
  if(_gdNew||sessionStorage.getItem("rb_after_login")){try{sessionStorage.removeItem("rb_after_login");}catch(e){}if(gdToken)setTimeout(()=>syncDrive(),400);}
  else autoSyncSoon(30000);/* Abgleich erst, wenn die App steht */
  /* Altlasten früherer Versionen */
  ["rb_mapshere"].forEach(k=>{if(ls(k))ls(k,null);});
  if(!ls("rb_noreg")){ls("rb_noreg","1");try{await del("meta","regions");}catch(e){}}/* Regionen entfernt (v7.4) */
  setTimeout(vecAutoDefault,1500);
  setTimeout(handleShare,600);
  /* Alles Weitere erst, wenn die Karte steht – Schritt für Schritt, damit die App bedienbar bleibt */
  const idle=f=>new Promise(r=>setTimeout(()=>(window.requestIdleCallback||(c=>c()))(()=>{Promise.resolve().then(f).catch(()=>{}).then(r);},{timeout:1500}),50));
  (async()=>{
    stMark("Karte bereit");
    if(poiShow.length)await idle(async()=>{await loadPoiOff();drawOsm();});
    await idle(async()=>{try{const o=await getOne("meta","osmpoi");if(o)osmData={items:o.items||[],loaded:o.loaded,scope:o.scope||""};}catch(e){}drawOsm();});
    await idle(loadGeo);
    await idle(async()=>{if(!countryData)await ensureCountries();else await assignCountries();});
    /* einmalige Reparaturen (früher bei jedem Start) */
    await idle(async()=>{if(localStorage.getItem("rb_fix_osm1")&&localStorage.getItem("rb_fix_wild1"))return;let n1=0,n2=0;
      for(const p of await getAll("points")){if(p.deleted)continue;let ch=false;
        if(!localStorage.getItem("rb_fix_osm1")&&p.trip===MIG_TRIP&&/^OsmAnd/.test(p.source||"")){p.trip="";ch=true;n1++;}
        if(p.cat==="wildlife"){p.cat="sight";ch=true;n2++;}
        if(ch){p.updated=Date.now();await put("points",p);}}
      localStorage.setItem("rb_fix_osm1","1");localStorage.setItem("rb_fix_wild1","1");
      if(n1||n2){await loadPoints();if(n1)toast(`${n1} OsmAnd-Orte wieder ohne Reise`,5000);if(n2)setTimeout(()=>toast(`${n2} Punkte «Tierbeobachtung» sind jetzt «Sehenswürdigkeit»`,5000),n1?5200:0);}});
    await idle(()=>trashPurgeOld());
  })();
  if("serviceWorker" in navigator&&location.protocol==="https:"){
    const hadCtrl=!!navigator.serviceWorker.controller;let reloaded=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!hadCtrl||reloaded)return;reloaded=true;toast("Neue Version wird geladen …",3000);setTimeout(()=>location.reload(),600);});
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{swReg=r;r.update().catch(()=>{});}).catch(()=>{});
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&swReg)swReg.update().catch(()=>{});});}
})();
