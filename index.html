<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#2f3b2f">
<title>ibexmap</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f4f1ea;--ink:#222;--muted:#6b6b6b;--accent:#2f3b2f;--accent2:#c8742c;--line:#d9d3c7;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
#app{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{flex:none;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--accent);color:#fff}
header h1{font-size:18px;margin:0;flex:1;font-weight:600;letter-spacing:.3px}
header .gps{font-size:12px;opacity:.85}
.hbtn{border:1px solid rgba(255,255,255,.5);background:none;color:#fff;border-radius:8px;font-size:18px;padding:2px 10px;margin-left:6px}
.hbtn.busy{opacity:.5}
.bar{height:10px;background:#ddd;border-radius:5px;overflow:hidden;margin:10px 0}.bar div{height:100%;background:var(--accent2);width:0}
#map{flex:1;position:relative;min-height:0}
nav{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:max(env(safe-area-inset-bottom),0px)}
nav button{border:0;background:none;padding:10px 4px 12px;font-size:13px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:22px;line-height:1}
nav button.primary{color:var(--accent2);font-weight:700}
nav button.on{color:var(--accent2)}
.fab.add{background:var(--accent2);color:#fff;font-size:28px;font-weight:700;width:56px;height:56px;right:8px}
#locBtn{bottom:calc(20px + env(safe-area-inset-bottom))}
.fab{display:flex;align-items:center;justify-content:center;color:var(--ink);position:absolute;right:12px;bottom:20px;z-index:500;width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);font-size:22px}
.fab.follow{background:var(--accent2);color:#fff}
.fab.active{background:var(--accent);color:#fff}
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.stars button{border:0;background:none;font-size:26px;line-height:1;padding:2px;color:#cfc8b8}
.stars button.on{color:#e0a100}
.rate{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px}
.rate .rrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:wrap}
.rate .rrow b{font-weight:600;font-size:14px}
.rate input{margin-top:4px;padding:6px 8px;font-size:14px}
.sv{color:#e0a100;letter-spacing:1px}
.clu{border-radius:50%;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;position:relative;font-size:18px}
.clu b{position:absolute;right:-6px;top:-6px;background:#222;color:#fff;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.ico{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none;vertical-align:middle}
.chip .ico{margin-right:4px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin-top:4px}
.catgrid button{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;font:inherit;font-size:12px;color:var(--ink);line-height:1.2;text-align:center}
.catgrid button.on{border-color:var(--accent2);background:#fff6ec;font-weight:600}
.osmpin{border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:600;background:var(--accent2);color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.3);display:none}
.sheet{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;z-index:1000;background:rgba(0,0,0,.35);display:none}
.sheet.open{display:block}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:calc(24px + env(safe-area-inset-bottom)) !important;background:var(--bg);border-radius:16px 16px 0 0;padding:14px 16px 24px}
@media (min-width:900px){.panel{left:auto;right:0;top:0;bottom:0;width:440px;max-height:none;border-radius:0}}
.ptop{position:sticky;top:-14px;margin:-14px -16px 6px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.ptop .px{border:0;background:#fff;border-radius:50%;width:40px;height:40px;font-size:18px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.ptop .pback{border:0;background:none;font-size:16px;font-weight:600;color:var(--accent);padding:8px 6px}
.ptop .pgrab{width:40px;height:5px;border-radius:3px;background:#cfc8b8}
.panel h2{margin:4px 0 12px;font-size:19px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:110px;resize:vertical}
.btn{border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;background:var(--accent);color:#fff}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:#a33}
.btn.or{background:var(--accent2)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.photos .ph{position:relative;width:96px;height:96px;border-radius:8px;overflow:hidden;background:#ddd}
.photos .ph img{width:100%;height:100%;object-fit:cover}
.photos .ph button{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:24px;height:24px;background:rgba(0,0,0,.6);color:#fff}
.drop{border:2px dashed var(--line);border-radius:8px;padding:10px;text-align:center;color:var(--muted);font-size:13px;margin-top:6px}
.drop.over{border-color:var(--accent2);color:var(--accent2)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 10px;font-size:13px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.item{display:flex;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;align-items:center}
.item img{width:56px;height:56px;object-fit:cover;border-radius:6px;background:#ddd;flex:none}
.item .noimg{width:56px;height:56px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px}
.item .t{font-weight:600}
.item .s{font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.detail img.big{width:100%;border-radius:10px;margin-bottom:6px}
.desc{white-space:pre-wrap;line-height:1.45}
.muted{color:var(--muted);font-size:13px}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}
.pin span{transform:rotate(45deg);font-size:15px}
.pin.visited{opacity:.55}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;z-index:2000;display:none;font-size:14px;max-width:90%}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}

.xh{position:relative;width:64px;height:120px}
.xh svg{position:absolute;left:0;top:0}
.xh .grip{position:absolute;left:12px;top:70px;width:40px;height:40px;border-radius:50%;background:rgba(200,116,44,.9);border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.5);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center}
.xh .stem{position:absolute;left:31px;top:52px;width:2px;height:20px;background:#fff;box-shadow:0 0 2px #000}
.placebar{position:absolute;left:8px;right:8px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:650;background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.35);padding:10px;display:none}
.placebar .actions{margin-top:6px;flex-wrap:nowrap}.placebar .btn{padding:10px 12px}
#map.placing .fab{display:none}
#map.placing,#map.placing .leaflet-grab,#map.placing .leaflet-interactive,#map.placing .leaflet-dragging .leaflet-grab{cursor:crosshair !important}
</style>
</head>
<body>
<div id="app">
  <header><img src="icon-192.png" alt="" style="width:28px;height:28px;border-radius:7px;flex:none"><h1>ibexmap <span id="ver" style="font-size:12px;font-weight:400;opacity:.7"></span></h1><button class="hbtn" id="tripName" title="Aktuelle Reise – antippen zum Wechseln" style="font-size:12px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></button><span class="gps" id="gpsInfo">GPS aus</span><button class="hbtn" id="syncBtn" title="Mit Google Drive abgleichen" style="display:none">⟳</button><button class="hbtn" id="navMenu" title="Menü" aria-label="Menü" style="font-weight:700;padding:2px 12px">⋮</button></header>
  <div id="map">
    <div class="hint" id="hint">Tippe ungefähr auf die Stelle – danach fein einstellen · <u id="hintCancel">Abbrechen</u></div>
    <div class="placebar" id="placebar"><div class="muted" id="pbInfo">Am Griff ✥ ziehen</div>
      <div class="actions"><button class="btn" id="pbOk">✓ Punkt hier setzen</button><button class="btn sec" id="pbNo">Abbrechen</button></div></div>
    <button class="fab add" id="navAdd" title="Punkt setzen" style="bottom:calc(260px + env(safe-area-inset-bottom))">＋</button>
    <button class="fab" id="navHere" title="Hier merken (aktueller Standort)" style="bottom:calc(200px + env(safe-area-inset-bottom))">📍</button>
    <button class="fab" id="navList" title="Liste" style="bottom:calc(140px + env(safe-area-inset-bottom))">☰</button>
    <button class="fab" id="locBtn" title="Mein Standort">◎</button>
    <button class="fab" id="filtBtn" title="Filter: was auf der Karte angezeigt wird" style="bottom:calc(80px + env(safe-area-inset-bottom))"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 4h18l-7 8.5V19l-4 2v-8.5z"/></svg></button>
  </div>
</div>

<div class="sheet" id="sheet"><div class="panel" id="panel"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileImport" accept=".json,.gpx,application/json,application/gpx+xml" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
"use strict";
/* ---------- Konstanten ---------- */
const CATS={
  wild:{n:"Stellplatz",c:"#2e7d32",i:"🌲"},
  camp:{n:"Camping",c:"#1565c0",i:"⛺"},
  sight:{n:"Sehenswürdigkeit",c:"#8e24aa",i:"★"},
  hike:{n:"Wanderung / Hochtour",c:"#6d4c41",i:"🏔️"},
  wildlife:{n:"Tierbeobachtung",c:"#c49000",i:"🔭"},
  shop:{n:"Einkauf / Supermarkt",c:"#00897b",i:"🛒"},
  fuel:{n:"Tankstelle",c:"#ef6c00",i:"⛽"},
  service:{n:"Autowerkstatt",c:"#546e7a",i:"🔧"},
  water:{n:"Wasser / Trinkwasser",c:"#0288d1",i:"💧"},
  warn:{n:"Achtung",c:"#c62828",i:"⚠️"},
  other:{n:"Sonstiges",c:"#757575",i:"🔹"}
};

/* ---------- Eigene Symbole (wie OSM/OsmAnd: weisses Piktogramm auf Farbe) ---------- */
const D="rgba(0,0,0,.38)";
const ICON={
  wild:`<path d="M7.5 2 3 9h2.4L2.5 14h10l-2.9-5H12z" fill="#fff"/><rect x="6.6" y="14" width="1.8" height="5" fill="#fff"/><path d="M13 12.5h9M13 15.5h9M14 15.5V20M21 15.5V20" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none"/>`,
  camp:`<path d="M12 3 2 20h20z" fill="#fff"/><path d="M12 11.5 8.8 20h6.4z" fill="${D}"/><path d="M10 2.5l2 3 2-3" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>`,
  sight:`<path d="M12 2.5 2.5 8h19z" fill="#fff"/><rect x="4.5" y="9.5" width="2.6" height="8" fill="#fff"/><rect x="10.7" y="9.5" width="2.6" height="8" fill="#fff"/><rect x="16.9" y="9.5" width="2.6" height="8" fill="#fff"/><rect x="2.5" y="18.5" width="19" height="2.5" rx=".5" fill="#fff"/>`,
  hike:`<path d="M1.5 20.5 9 7l4 6.5L16 9l6.5 11.5z" fill="#fff"/><path d="M9 7l-2.1 3.8L9 10l1.6 1.6z" fill="${D}"/>`,
  wildlife:`<rect x="4" y="4" width="5" height="9" rx="1.5" fill="#fff"/><rect x="15" y="4" width="5" height="9" rx="1.5" fill="#fff"/><rect x="9" y="7" width="6" height="3.5" fill="#fff"/><circle cx="6.5" cy="16" r="4" fill="#fff"/><circle cx="17.5" cy="16" r="4" fill="#fff"/><circle cx="6.5" cy="16" r="2" fill="${D}"/><circle cx="17.5" cy="16" r="2" fill="${D}"/>`,
  shop:`<path d="M2 4h3l2.6 10.5h10.8L21 7H6.4" stroke="#fff" stroke-width="2.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="9" cy="19" r="1.9" fill="#fff"/><circle cx="17" cy="19" r="1.9" fill="#fff"/>`,
  fuel:`<rect x="3.5" y="3" width="10" height="18" rx="1.5" fill="#fff"/><rect x="5.5" y="5.5" width="6" height="4.5" fill="${D}"/><path d="M13.5 9.5h2.2a1.5 1.5 0 0 1 1.5 1.5v5.5a1.6 1.6 0 0 0 3.2 0V8L17.7 5.2" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`,
  service:`<path d="M15.2 3.2a5 5 0 0 0-5.6 6.8L3 16.6 7.4 21l6.6-6.6a5 5 0 0 0 6.8-5.6l-3.1 3.1-3.3-.9-.9-3.3z" fill="#fff"/>`,
  water:`<path d="M12 2.5C9 7.2 5.5 10.6 5.5 14.6a6.5 6.5 0 0 0 13 0c0-4-3.5-7.4-6.5-12.1z" fill="#fff"/><path d="M9 14.8a3 3 0 0 0 3 3" stroke="${D}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`,
  warn:`<path d="M12 2.8 22.2 20.5H1.8z" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><rect x="10.9" y="8.5" width="2.2" height="6.5" rx="1" fill="${D}"/><circle cx="12" cy="17.6" r="1.3" fill="${D}"/>`,
  other:`<circle cx="12" cy="12" r="9.5" fill="#fff"/><circle cx="12" cy="7.3" r="1.5" fill="${D}"/><rect x="10.8" y="10" width="2.4" height="8" rx="1" fill="${D}"/>`
};
const svgI=(k,sz=18)=>`<svg viewBox="0 0 24 24" width="${sz}" height="${sz}" aria-hidden="true" style="display:block">${ICON[k]||ICON.other}</svg>`;
const icoBadge=(k,color,sz=22)=>`<span class="ico" style="background:${color};width:${sz}px;height:${sz}px">${svgI(k,Math.round(sz*.68))}</span>`;
const STATUS={idee:"Idee",fix:"Fixpunkt",besucht:"Besucht"};
const WATERQ={trink:"Trinkwasser",brauch:"Nur Brauchwasser (abkochen/filtern)",unklar:"Unbekannt"};
const RATE={
  wild:[["umgebung","Umgebung"],["wohl","Wohlfühlen"],["wasser","Am Wasser","ja"]],
  camp:[["sanitaer","Sanitär"],["platz","Stellplatz"],["preis","Kosten/Nutzen"],["resto","Restaurant"],["wasser","Am Wasser","ja"]]
};
const fmtD=d=>d?new Date(String(d).length===10?d+"T12:00:00":d).toLocaleDateString("de-CH"):"";
const fmtDT=t=>t?new Date(t).toLocaleString("de-CH",{dateStyle:"short",timeStyle:"short"}):"";
function ptTitle(p){if(p.title)return p.title;const c=CATS[p.cat]||CATS.other;
  return c.n+(p.region?", "+p.region.split(/[,(]/)[0].trim():"")+" "+fmtD(p.visited||p.created);}
const isOn=v=>!!v&&(v.b!==undefined?v.b:v.s>0);
const starTxt=n=>n?"★".repeat(n)+"☆".repeat(5-n):"";
function starsWidget(name,val){return `<span class="stars" data-name="${name}" data-v="${val||0}">${[1,2,3,4,5].map(i=>`<button type="button" data-i="${i}" class="${i<=(val||0)?"on":""}">★</button>`).join("")}</span>`;}
function bindStars(root){root.querySelectorAll(".stars").forEach(w=>w.querySelectorAll("button").forEach(b=>b.onclick=()=>{
  const i=+b.dataset.i,v=+w.dataset.v===i?0:i;w.dataset.v=v;w.querySelectorAll("button").forEach(x=>x.classList.toggle("on",+x.dataset.i<=v));}));}
function rateText(p){const cr=RATE[p.cat];if(!cr)return "";const r=p.rate||{};
  return [p.stars?"Gesamt "+starTxt(p.stars):"",...cr.map(([k,l,ty])=>ty?(isOn(r[k])?`${l}${r[k].t?" – "+r[k].t:""}`:""):r[k]&&(r[k].s||r[k].t)?`${l}: ${starTxt(r[k].s)}${r[k].t?" – "+r[k].t:""}`:"")].filter(Boolean).join("\n");}
const GROUP="ibexmap";
const VERSION="v1.19";
/* Vorschlag Marokko: Sektoren in Reihenfolge der Route. box=[Süd,West,Nord,Ost], erste passende Box gilt */
const MA_SECTORS=[
 {n:"A Norden",zeit:"5.–10. April",klima:"Frühling, grün; 15–22 °C, im Rif Regen möglich, Nächte kühl",info:"Tanger Med, Chefchaouen, Fès, Meknès – ankommen, Städte, einkaufen. Eher Campings.",box:[[33.8,-5.9,35.95,-1.0]]},
 {n:"B Mittlerer Atlas",zeit:"11.–16. April",klima:"Kühl, 10–18 °C, Nächte um 0 °C, Schnee auf Pässen noch möglich",info:"Ifrane, Zedernwälder Azrou (Berberaffen), Seen, Midelt – erste Wildcamps.",box:[[32.4,-6.0,33.8,-3.5]]},
 {n:"C Wüste",zeit:"17.–24. April",klima:"Tags 25–32 °C, Nächte frisch; Sandsturm möglich – beste Zeit vor der Hitze",info:"Ziz-Schlucht, Erfoud, Merzouga/Erg Chebbi. Dünen nur mit Begleitung/Guide.",box:[[30.4,-4.9,32.4,-1.0]]},
 {n:"D Schluchten",zeit:"25. April–1. Mai",klima:"Tags 20–28 °C, Nächte kühl; Gewitter in den Bergen → Sturzflutgefahr",info:"Todra, Dades, Rosental (Rosenernte Anfang Mai). Nie im Flussbett schlafen.",box:[[31.15,-6.5,32.4,-4.9]]},
 {n:"E Draa",zeit:"2.–8. Mai",klima:"Warm bis heiss, 28–35 °C, sehr trocken",info:"Ouarzazate (Service), Aït-Ben-Haddou, Draa-Tal, Zagora – Oasen und Kasbahs.",box:[[29.5,-7.5,31.15,-4.9]]},
 {n:"F Anti-Atlas",zeit:"9.–17. Mai",klima:"Warm, 25–32 °C, Nächte angenehm",info:"Tata, Tafraoute, Ammeln-Tal – ruhige Granitberge. Opferfest ca. 16./17. Mai: ruhig bleiben, vorher einkaufen/tanken.",box:[[28.8,-9.3,30.4,-7.5]]},
 {n:"G Küste Süd",zeit:"18.–27. Mai",klima:"Mild, 20–25 °C, oft Morgennebel, windig",info:"Tiznit, Mirleft, Legzira, Sidi Ifni, Souss-Massa, Taghazout – Meer und Strand.",box:[[28.5,-11.0,30.9,-9.3]]},
 {n:"H Essaouira",zeit:"28.–30. Mai",klima:"Kühl und sehr windig (Passat), 18–23 °C",info:"Medina am Meer, Strände Sidi Kaouki.",box:[[30.9,-10.2,32.2,-9.3]]},
 {n:"I Hoher Atlas",zeit:"31. Mai–4. Juni",klima:"Berge angenehm 15–25 °C, Gipfel Schnee möglich; Marrakesch schon 33–38 °C",info:"Marrakesch, Tizi n'Tichka, Imlil (Toubkal nur mit Bergführer), Ouzoud-Fälle.",box:[[30.9,-9.3,32.4,-6.5]]},
 {n:"J Rückweg Nord",zeit:"5.–8. Juni",klima:"Atlantikküste angenehm 22–27 °C, Landesinnere heiss",info:"Rabat, Moulay Bousselham, Asilah, Tanger Med – zur Fähre nach Spanien.",box:[[32.2,-10.2,35.95,-5.9],[32.4,-6.5,33.8,-6.0]]}
];
function sectorOf(lat,lon){const s=MA_SECTORS.find(x=>x.box.some(b=>lat>=b[0]&&lat<=b[2]&&lon>=b[1]&&lon<=b[3]));return s&&sections.includes(s.n)?s.n:"";}

    if(!d.objectStoreNames.contains("meta"))d.createObjectStore("meta",{keyPath:"id"});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function tx(store,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error);});}
const getAll=st=>new Promise((res,rej)=>{const r=db.transaction(st).objectStore(st).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const getOne=(st,id)=>new Promise((res,rej)=>{const r=db.transaction(st).objectStore(st).get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});

const del=(st,id)=>tx(st,"readwrite",s=>s.delete(id));

let trips=[],curTrip="",sections=[],delTrips=[];let regionData=null;
const MIG_TRIP="t-marokko-2027";

const curTripObj=()=>tripOf(curTrip)||trips[0];
const tripName=id=>(tripOf(id)||{}).name||"";
function bindSections(){const t=curTripObj();if(t){curTrip=t.id;t.sections=t.sections||[];sections=t.sections;}else sections=[];}
async function saveTrips(){await put("meta",{id:"trips",list:trips,deleted:delTrips});try{localStorage.setItem("rb_trip",curTrip);}catch(e){}}
async function loadMeta(){
  const t=await getOne("meta","trips");

  else{/* Umstellung: bisherige Abschnitte und Punkte gehören zur Reise «Marokko 2027» (feste ID, damit alle Geräte gleich umstellen) */
    const m=await getOne("meta","sections");
    trips=[{id:MIG_TRIP,name:"Marokko 2027",sections:m&&m.list&&m.list.length?m.list:MA_SECTORS.map(x=>x.n),updated:1}];
    for(const p of await getAll("points"))if(!p.trip&&!p.deleted){p.trip=MIG_TRIP;await put("points",p);}
    await put("meta",{id:"trips",list:trips});}
  try{curTrip=localStorage.getItem("rb_trip")||"";}catch(e){}
  if(!tripOf(curTrip))curTrip=trips[0].id;bindSections();

  const c=await getOne("meta","countries");countryData=c?c.data:null;prepCountries();}
async function saveSections(trip){const t=trip||curTripObj();if(!t)return;t.updated=Date.now();await saveTrips();}
async function addSection(name,tripId){name=(name||"").trim();const t=tripOf(tripId)||curTripObj();
  if(name&&t&&!t.sections.includes(name)){t.sections.push(name);await saveSections(t);}return name;}
function secOpts(tripId,sel){const t=tripOf(tripId);const list=t?t.sections:[];
  return `<option value="">– kein Abschnitt –</option>${list.map(x=>`<option ${sel===x?"selected":""}>${esc(x)}</option>`).join("")}${sel&&!list.includes(sel)?`<option selected>${esc(sel)}</option>`:""}${t?`<option value="__new">+ Neuer Abschnitt …</option>`:""}`;}
function mergeTrips(remote,remoteDel){let ch=false;
  for(const d of remoteDel||[]){const k=delTrips.find(x=>x.id===d.id);if(!k){delTrips.push(d);ch=true;}
    const l=tripOf(d.id);if(l&&(l.updated||0)<=d.updated&&!points.some(p=>p.trip===d.id&&!p.deleted)){trips=trips.filter(x=>x.id!==d.id);ch=true;}}
  for(const r of remote||[]){const l=tripOf(r.id);const dd=delTrips.find(x=>x.id===r.id);if(dd&&dd.updated>=(r.updated||0))continue;
    if(!l){trips.push(r);ch=true;}
    else if((r.updated||0)>(l.updated||0)){l.name=r.name;l.sections=r.sections||[];l.updated=r.updated;ch=true;}}
  if(!trips.length)trips=[{id:MIG_TRIP,name:"Marokko 2027",sections:MA_SECTORS.map(x=>x.n),updated:1}];
  if(!tripOf(curTrip))curTrip=trips[0].id;bindSections();return ch;}
async function setCurTrip(id){if(!tripOf(id))return;curTrip=id;bindSections();await saveTrips();showHeaderTrip();drawPoints();}

/* ---------- Länder (automatisch aus den Koordinaten, offline nach einmaligem Laden) ---------- */
const COUNTRY_SRC="https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@v5.1.2/geojson/ne_50m_admin_0_countries.geojson";
let countryData=null;
const DN=(()=>{try{return new Intl.DisplayNames(["de"],{type:"region"});}catch(e){return null;}})();
function countryName(code){if(!code)return "";try{const n=DN&&DN.of(code);if(n&&n!==code)return n;}catch(e){}
  const f=(countryData||[]).find(x=>x.c===code);return f?f.n:code;}
function prepCountries(){(countryData||[]).forEach(f=>{if(f.b)return;let a=180,b=90,c=-180,d=-90;
  const polys=f.g.type==="Polygon"?[f.g.coordinates]:f.g.coordinates;
  polys.forEach(p=>p[0].forEach(([x,y])=>{if(x<a)a=x;if(y<b)b=y;if(x>c)c=x;if(y>d)d=y;}));f.b=[a,b,c,d];});}
async function downloadCountries(){const fc=await(await fetch(COUNTRY_SRC)).json();
  const r=v=>Math.round(v*1000)/1000,rd=g=>g.type==="Polygon"?{type:"Polygon",coordinates:g.coordinates.map(ring=>ring.map(([x,y])=>[r(x),r(y)]))}
    :{type:"MultiPolygon",coordinates:g.coordinates.map(pl=>pl.map(ring=>ring.map(([x,y])=>[r(x),r(y)])))};
  countryData=fc.features.filter(f=>f.geometry).map(f=>{const P=f.properties||{};
    let c=[P.ISO_A2_EH,P.ISO_A2,P.WB_A2].find(v=>v&&/^[A-Z]{2}$/.test(v))||"";
    return {c,n:P.NAME_DE||P.NAME||c,g:rd(f.geometry)};}).filter(f=>f.c);
  await put("meta",{id:"countries",data:countryData,loaded:Date.now()});prepCountries();return countryData.length;}
function countryAt(lat,lon){for(const f of countryData||[]){const b=f.b;if(b&&(lon<b[0]||lon>b[2]||lat<b[1]||lat>b[3]))continue;if(inGeom(lon,lat,f.g))return f.c;}return "";}
function countryOf(lat,lon){if(!countryData)return "";let c=countryAt(lat,lon);if(c)return c;
  /* Punkt knapp im Meer (Küste, Hafen): Umgebung absuchen */
  for(const d of [0.02,0.05,0.1])for(const[dy,dx]of[[d,0],[-d,0],[0,d],[0,-d],[d,d],[-d,-d],[d,-d],[-d,d]]){c=countryAt(lat+dy,lon+dx);if(c)return c;}return "";}
async function assignCountries(){let n=0;for(const p of await getAll("points"))if(!p.deleted&&!p.country){const c=countryOf(p.lat,p.lon);if(c){p.country=c;await put("points",p);n++;}}
  if(n)await loadPoints();return n;}
async function ensureCountries(){if(countryData||!navigator.onLine)return;try{await downloadCountries();await assignCountries();}catch(e){}}

/* ---------- Regionen (automatisch, offline nach einmaligem Laden) ---------- */
const REGION_SRC={prov:"https://cdn.jsdelivr.net/npm/morocco-map@1.3.0/data/provinces.json",reg:"https://cdn.jsdelivr.net/npm/morocco-map@1.3.0/data/regions.json"};
function loadScript(src){return new Promise((res,rej)=>{if(window.topojson)return res();const e=document.createElement("script");e.src=src;e.onload=res;e.onerror=()=>rej(new Error("Skript nicht ladbar"));document.head.appendChild(e);});}
function nameOf(p){p=p||{};return p.name||p.NAME||p.nom||p.Nom||p.name_fr||p.NAME_2||p.NAME_1||Object.values(p).find(v=>typeof v==="string"&&v.length>2&&!/^[A-Z]{2}-/.test(v))||"";}
function slim(fc){return fc.features.map(f=>({n:nameOf(f.properties)||String(f.id||""),g:f.geometry}));}
async function downloadRegions(){
  await loadScript("https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js");
  const out={};
  for(const [k,u] of Object.entries(REGION_SRC)){const topo=await (await fetch(u)).json();let feats=[];
    for(const key of Object.keys(topo.objects)){const fc=topojson.feature(topo,topo.objects[key]);feats=feats.concat(fc.type==="FeatureCollection"?slim(fc):slim({features:[fc]}));}
    out[k]=feats;}
  regionData=out;await put("meta",{id:"regions",data:out,loaded:Date.now()});return out;}
function inRing(x,y,ring){let ins=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
  if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins;}return ins;}
function inGeom(x,y,g){if(!g)return false;const polys=g.type==="Polygon"?[g.coordinates]:g.type==="MultiPolygon"?g.coordinates:[];
  return polys.some(p=>inRing(x,y,p[0])&&!p.slice(1).some(h=>inRing(x,y,h)));}
function regionOf(lat,lon){if(!regionData)return "";const f=list=>(list||[]).find(e=>inGeom(lon,lat,e.g));
  const pr=f(regionData.prov),rg=f(regionData.reg);return [pr&&pr.n,rg&&rg.n].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(" · ");}

const OSM_MINZOOM=10;

const osmLayer=L.layerGroup().addTo(map);const osmCanvas=L.canvas({padding:.3});
function osmType(t){if(t.amenity==="fuel")return "fuel";
  if(/^(drinking_water|water_point|fountain)$/.test(t.amenity||"")||/^(water_tap|water_well)$/.test(t.man_made||"")||t.natural==="spring")return "water";
  if(/^(car_repair|tyres|car_parts)$/.test(t.shop||"")||t.craft==="mechanic"||t.service==="tyres")return "service";
  if(/^(supermarket|convenience|general|greengrocer)$/.test(t.shop||""))return "shop";return "";}
function osmKind(t){const m={supermarket:"Supermarkt",convenience:"Laden / Hanout",general:"Gemischtwaren",greengrocer:"Gemüse/Obst",car_repair:"Autowerkstatt",tyres:"Reifen / Vulkaniseur",car_parts:"Autoteile"};
  if(osmType(t)==="water"){const dw=t.drinking_water,base=t.amenity==="drinking_water"?"Trinkwasserstelle":t.amenity==="water_point"?"Wasserstelle (Tank füllen)":t.amenity==="fountain"?"Brunnen":t.man_made==="water_tap"?"Wasserhahn":t.man_made==="water_well"?"Ziehbrunnen":t.natural==="spring"?"Quelle":"Wasser";
    return base+(t.amenity==="drinking_water"||dw==="yes"?" – Trinkwasser":dw==="no"?" – kein Trinkwasser":dw==="treated"?" – aufbereitet":" – Trinkbarkeit unbekannt");}
  return t.amenity==="fuel"?"Tankstelle":t.craft==="mechanic"?"Mechaniker":m[t.shop]||"";}
const KEEP=["drinking_water","natural","man_made","name","name:fr","name:ar","brand","opening_hours","phone","contact:phone","website","addr:city","addr:street","fuel:diesel","shop","amenity","craft","service"];
function osmQuery(scope){const cc=/^[A-Z]{2}$/.test(scope);const f=cc?"(area.a)":`(${scope})`;
  return `[out:json][timeout:240];${cc?`area["ISO3166-1"="${scope}"][admin_level=2]->.a;`:""}(`+
   `nwr["shop"~"^(supermarket|convenience|general|greengrocer|car_repair|tyres|car_parts)$"]${f};`+
   `nwr["amenity"="fuel"]${f};nwr["craft"="mechanic"]${f};`+
   `nwr["amenity"~"^(drinking_water|water_point|fountain)$"]${f};nwr["man_made"~"^(water_tap|water_well)$"]${f};node["natural"="spring"]${f};);out center tags;`;}
async function osmFetch(scope){let last;
  for(const ep of OVERPASS){try{const r=await fetch(ep,{method:"POST",body:"data="+encodeURIComponent(osmQuery(scope)),headers:{"Content-Type":"application/x-www-form-urlencoded"}});
      if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();
      return j.elements.map(e=>{const t=e.tags||{};const k={};KEEP.forEach(x=>{if(t[x])k[x]=t[x];});
        const lat=e.lat??(e.center&&e.center.lat),lon=e.lon??(e.center&&e.center.lon);
        return {id:e.type[0]+e.id,lat,lon,ty:osmType(t),t:k};}).filter(x=>x.ty&&x.lat!=null);}

    editPoint(newPoint(x.lat,x.lon,Object.assign({title:nm,cat:x.ty,desc,source:"OpenStreetMap"},x.ty==="water"?{water:(t.amenity==="drinking_water"||t.drinking_water==="yes")?"trink":t.drinking_water==="no"?"brauch":"unklar"}:{})),true);};}

/* ---------- GPS ---------- */
let me=null,meMarker=null,meCircle=null,follow=false,watchId=null;
function startGPS(){
  if(!("geolocation" in navigator)){$("#gpsInfo").textContent="Kein GPS";return;}
  if(watchId!==null)return;
  watchId=navigator.geolocation.watchPosition(pos=>{
    me={lat:pos.coords.latitude,lon:pos.coords.longitude,acc:pos.coords.accuracy};
    $("#gpsInfo").textContent=`GPS ±${Math.round(me.acc)} m`;
    if(!meMarker){meMarker=L.circleMarker([me.lat,me.lon],{radius:8,color:"#fff",weight:3,fillColor:"#1e88e5",fillOpacity:1}).addTo(map);
      meCircle=L.circle([me.lat,me.lon],{radius:me.acc,color:"#1e88e5",weight:1,fillOpacity:.1}).addTo(map);}
    else{meMarker.setLatLng([me.lat,me.lon]);meCircle.setLatLng([me.lat,me.lon]).setRadius(me.acc);}
    if(follow)map.setView([me.lat,me.lon],Math.max(map.getZoom(),14));
  },err=>{$("#gpsInfo").textContent="GPS: "+(err.code===1?"nicht erlaubt":"kein Signal");},
  {enableHighAccuracy:true,maximumAge:5000,timeout:30000});
}
$("#locBtn").onclick=()=>{startGPS();follow=!follow;$("#locBtn").classList.toggle("follow",follow);
  if(follow&&me)map.setView([me.lat,me.lon],Math.max(map.getZoom(),14));
  toast(follow?"Karte folgt deinem Standort":"Karte folgt nicht mehr");};
map.on("dragstart",()=>{if(follow){follow=false;$("#locBtn").classList.remove("follow");}});
function distKm(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

/* ---------- Fotos ---------- */
function resize(file,max=1600,q=.82){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);
  img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(u);
    cv.toBlob(b=>b?res(b):rej(new Error("Bild")),"image/jpeg",q);};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("Bild konnte nicht gelesen werden"));};img.src=u;});}
async function photoURL(id){if(thumbs[id])return thumbs[id];const p=await getOne("photos",id);if(!p)return "";thumbs[id]=URL.createObjectURL(p.blob);return thumbs[id];}

async function renderItems(){

function writeGPX(list,label){const x=s=>esc(s);

$("#fileImport").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const text=await f.text();
  if(f.name.toLowerCase().endsWith(".gpx"))return importGPX(text);

  openPanel(`<h2>Reisepaket importieren</h2><p>${pkg.points.filter(p=>!p.deleted).length} Punkte${pkg.points.some(p=>p.deleted)?" (+ "+pkg.points.filter(p=>p.deleted).length+" Löschungen)":""}, exportiert am ${esc(new Date(pkg.exported).toLocaleString("de-CH"))}.</p>
    <p class="muted"><b>Zusammenführen:</b> neue Punkte kommen dazu, bei gleichen Punkten gewinnt die neuere Version. Auch Löschungen werden übernommen, wenn sie neuer sind.<br><b>Ersetzen:</b> alle Punkte auf diesem Gerät werden gelöscht und durch das Paket ersetzt.</p>
    <div class="actions"><button class="btn" id="iMerge">Zusammenführen</button><button class="btn warn" id="iRepl">Alles ersetzen</button><button class="btn sec" id="iNo">Abbrechen</button></div>`);
  $("#iNo").onclick=closePanel;

    if(replace){for(const p of await getAll("points")){for(const id of p.photos||[])await del("photos",id);await del("points",p.id);}}
    const existing=Object.fromEntries((await getAll("points")).map(p=>[p.id,p]));let n=0;
    let nd=0;
    for(const p of pkg.points){const ex=existing[p.id];if(ex&&(ex.updated||0)>=(p.updated||0))continue;
      if(ex&&!ex.deleted)for(const id of ex.photos||[])if(!(p.photos||[]).includes(id))await del("photos",id);
      if(p.deleted){await put("points",p);if(ex&&!ex.deleted)nd++;continue;}
      for(const id of p.photos||[])if(pkg.photos?.[id])await put("photos",{id,blob:await dataToBlob(pkg.photos[id])});
      if(!p.trip)p.trip=MIG_TRIP;if(!p.country)p.country=countryOf(p.lat,p.lon);
      await put("points",p);n++;}
    if(Array.isArray(pkg.trips)){if(replace){trips=pkg.trips;delTrips=pkg.deletedTrips||[];mergeTrips([]);}else mergeTrips(pkg.trips,pkg.deletedTrips);await saveTrips();showHeaderTrip();}
    else if(Array.isArray(pkg.sections)){const t=tripOf(MIG_TRIP)||curTripObj();for(const x of pkg.sections)if(!t.sections.includes(x))t.sections.push(x);await saveSections(t);}
    await loadPoints();closePanel();toast(`${n} Punkte übernommen${nd?", "+nd+" gelöscht":""}`);};
  $("#iMerge").onclick=()=>run(false);$("#iRepl").onclick=()=>confirmBox("Wirklich ALLE Punkte auf diesem Gerät ersetzen?",()=>run(true));
};
async function importGPX(text){const doc=new DOMParser().parseFromString(text,"application/xml");const w=[...doc.getElementsByTagName("wpt")];
  if(!w.length)return toast("Keine Wegpunkte gefunden");let n=0;
  for(const el of w){const g=t=>el.getElementsByTagName(t)[0]?.textContent||"";const typ=g("type");const sec=typ&&typ!==GROUP&&typ!=="Reisebuch"?typ:"";if(sec)await addSection(sec,curTrip);
    const la=+el.getAttribute("lat"),lo=+el.getAttribute("lon");
    await put("points",newPoint(la,lo,{title:g("name")||"Wegpunkt",desc:g("desc"),section:sec,region:regionOf(la,lo),status:/option/i.test(typ)?"idee":"fix"}));n++;}
  await loadPoints();closePanel();toast(`${n} Wegpunkte aus GPX importiert`);}

/* Anmeldung per Weiterleitung auf die Google-Seite (zuverlässiger als Popup; dort kann jedes Konto gewählt werden) */
const GD_REDIRECT=()=>location.origin+location.pathname;
function gdRestore(){try{const t=JSON.parse(sessionStorage.getItem("rb_gtok")||"null");if(t&&Date.now()<t.exp-60000){gdToken=t.tok;gdExp=t.exp;}}catch(e){}}
function gdFromRedirect(){if(!/access_token=|error=/.test(location.hash))return false;
  const q=new URLSearchParams(location.hash.slice(1));history.replaceState(null,"",location.pathname+location.search);
  if(q.get("state")!=="ibexmap"){return false;}
  if(q.get("error")){if(/interaction_required|login_required|consent_required/.test(q.get("error"))&&!sessionStorage.getItem("rb_retry")){
      sessionStorage.setItem("rb_retry","1");ls("rb_gconn",null);setTimeout(()=>gdAuth(true),300);return false;}
    sessionStorage.removeItem("rb_retry");setTimeout(()=>toast("Google-Anmeldung abgebrochen oder blockiert: "+q.get("error"),8000),500);return false;}
  try{sessionStorage.removeItem("rb_retry");}catch(e){}
  gdToken=q.get("access_token");gdExp=Date.now()+(+q.get("expires_in")||3600)*1000;ls("rb_gconn","1");
  try{sessionStorage.setItem("rb_gtok",JSON.stringify({tok:gdToken,exp:gdExp}));}catch(e){}return true;}
async function gdAuth(force){if(!force&&gdToken&&Date.now()<gdExp-60000)return gdToken;
  const u=new URL("https://accounts.google.com/o/oauth2/v2/auth");
  u.search=new URLSearchParams({client_id:gdClient(),redirect_uri:GD_REDIRECT(),response_type:"token",scope:GD_SCOPE,
    include_granted_scopes:"true",state:"ibexmap",prompt:ls("rb_gconn")&&!force?"none":"select_account consent",...(ls("rb_gmail")?{login_hint:ls("rb_gmail")}:{})}).toString();
  toast("Weiter zur Google-Anmeldung …",4000);
  try{sessionStorage.setItem("rb_after_login","sync");}catch(e){}
  location.href=u.toString();
  return new Promise(()=>{});}
async function gd(path,opt={}){const t=await gdAuth();
  const r=await fetch("https://www.googleapis.com/"+path,Object.assign({},opt,{headers:Object.assign({Authorization:"Bearer "+t},opt.headers||{})}));
  if(r.status===401){gdToken=null;try{sessionStorage.removeItem("rb_gtok");}catch(e){}throw new Error("Anmeldung abgelaufen – nochmals ⟳ tippen");}
  if(!r.ok)throw new Error("Google Drive antwortet mit Fehler "+r.status);return r;}
async function gdList(){let out=[],pt="";do{const r=await(await gd(`drive/v3/files?spaces=appDataFolder&pageSize=1000&fields=nextPageToken,files(id,name)${pt?"&pageToken="+encodeURIComponent(pt):""}`)).json();
  out=out.concat(r.files||[]);pt=r.nextPageToken||"";}while(pt);return out;}
async function gdUpload(name,blob,id){const fd=new FormData();
  fd.append("metadata",new Blob([JSON.stringify(id?{}:{name,parents:["appDataFolder"]})],{type:"application/json"}));fd.append("file",blob);

async function syncDrive(){if(syncing)return;

  syncing=true;$("#syncBtn").classList.add("busy");toast("Synchronisiere …",120000);
  try{const files=await gdList();const byName=Object.fromEntries(files.map(f=>[f.name,f]));
    let remote={points:[],trips:[]};
    if(byName[GD_DATA])remote=await(await gd(`drive/v3/files/${byName[GD_DATA].id}?alt=media`)).json();
    const local=Object.fromEntries((await getAll("points")).map(p=>[p.id,p]));let nIn=0;
    for(const p of remote.points||[]){const ex=local[p.id];if(ex&&(ex.updated||0)>=(p.updated||0))continue;
      if(ex&&!ex.deleted)for(const id of ex.photos||[])if(!(p.photos||[]).includes(id))await del("photos",id);
      if(!p.trip&&!p.deleted)p.trip=MIG_TRIP;
      await put("points",p);local[p.id]=p;nIn++;}
    if(Array.isArray(remote.trips)){if(mergeTrips(remote.trips,remote.deletedTrips)){await saveTrips();showHeaderTrip();}}
    const have=new Set(await keysOf("photos"));const need=new Set();
    Object.values(local).filter(p=>!p.deleted).forEach(p=>(p.photos||[]).forEach(id=>need.add(id)));
    let up=0,down=0,i=0;
    for(const id of need){const fn="foto_"+id+".jpg";i++;
      if(have.has(id)&&!byName[fn]){const ph=await getOne("photos",id);if(ph){toast(`Fotos hochladen … (${i}/${need.size})`,120000);await gdUpload(fn,ph.blob);up++;}}

    await gdUpload(GD_DATA,new Blob([JSON.stringify({app:"ibexmap",format:4,updated:Date.now(),trips,deletedTrips:delTrips,points:Object.values(local)})],{type:"application/json"}),byName[GD_DATA]&&byName[GD_DATA].id);
    for(const f of files)if(/^foto_.+\.jpg$/.test(f.name)&&!need.has(f.name.slice(5,-4)))await gd(`drive/v3/files/${f.id}`,{method:"DELETE"}).catch(()=>{});
    ls("rb_lastsync",String(Date.now()));await loadPoints();
    toast(`Abgeglichen: ${nIn} Änderungen geholt, ${up} Fotos hoch-, ${down} heruntergeladen`,5000);
  }catch(e){toast("Abgleich fehlgeschlagen: "+e.message,7000);}
  finally{syncing=false;$("#syncBtn").classList.remove("busy");}}

const OFFLINE="reisebuch-offline",MA_BOX={s:27.6,w:-13.3,n:35.95,e:-1.0};
let offRun=null;
function tileXY(lat,lon,z){const n=2**z,r=lat*Math.PI/180;
  return [Math.max(0,Math.min(n-1,Math.floor((lon+180)/360*n))),Math.max(0,Math.min(n-1,Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n)))];}
function tileKeys(areas,zmin,zmax){const set=new Set();
  for(const a of areas)for(let z=zmin;z<=zmax;z++){const[x1,y1]=tileXY(a.n,a.w,z),[x2,y2]=tileXY(a.s,a.e,z);
    for(let x=x1;x<=x2;x++)for(let y=y1;y<=y2;y++)set.add(z+"/"+x+"/"+y);}return set;}
function tileURL(lay,k){const[z,x,y]=k.split("/");const sd=lay.options.subdomains||"abc";
  return lay._url.replace("{s}",sd[Math.abs(+x+ +y)%sd.length]).replace("{z}",z).replace("{x}",x).replace("{y}",y);}
function offPlan(o){const lay=BASE[o.layer];const maxZ=Math.min(o.zmax,lay.options.maxZoom||19);
  const src0=o.only==="all"?points:points.filter(p=>p.trip===curTrip);
  let box=MA_BOX;if(src0.length){const la=src0.map(p=>p.lat),lo=src0.map(p=>p.lon);box={s:Math.min(...la)-1,n:Math.max(...la)+1,w:Math.min(...lo)-1,e:Math.max(...lo)+1};}
  const keys=tileKeys([box],5,8);
  const km=o.radius,src=o.only==="all"?points:o.only==="fix"?src0.filter(p=>p.status!=="idee"):src0;
  const areas=src.map(p=>{const dy=km/111,dx=km/(111*Math.cos(p.lat*Math.PI/180));return {s:p.lat-dy,n:p.lat+dy,w:p.lon-dx,e:p.lon+dx};});
  tileKeys(areas,9,maxZ).forEach(k=>keys.add(k));return {lay,keys:[...keys],n:src.length};}

    $("#oBack").onclick=()=>{if(offRun)offRun.stop=true;$("#navMenu").onclick();};
    $("#oDel").onclick=()=>confirmBox("Alle offline gespeicherten Kartenbilder löschen?",async()=>{await caches.delete(OFFLINE);cnt=0;toast("Offline-Karte gelöscht");draw();});
    $("#oStop").onclick=()=>{if(offRun)offRun.stop=true;};
    $("#oGo").onclick=()=>offDownload(pl);};
  draw();}
async function offDownload(pl){if(!navigator.onLine)return toast("Kein Internet",4000);
  const c=await caches.open(OFFLINE);const have=new Set((await c.keys()).map(r=>r.url));
  const todo=pl.keys.map(k=>tileURL(pl.lay,k)).filter(u=>!have.has(u));
  const run=offRun={stop:false};let done=0,fail=0;const total=todo.length;
  $("#oBar").style.display="";$("#oStop").style.display="";$("#oGo").disabled=true;
  const upd=()=>{const b=$("#oBar div");if(b)b.style.width=(total?Math.round(done/total*100):100)+"%";const i=$("#oInfo");if(i)i.textContent=`${done} von ${total} neu geladen${fail?`, ${fail} Fehler`:""}${pl.keys.length-total?` (${pl.keys.length-total} schon vorhanden)`:""}`;};
  upd();let idx=0;
  const worker=async()=>{while(!run.stop&&idx<todo.length){const u=todo[idx++];
    try{let r=await fetch(u,{mode:"cors"}).catch(()=>null);if(!r||!r.ok)r=await fetch(u,{mode:"no-cors"});await c.put(u,r);}catch(e){fail++;}
    done++;if(done%10===0||done===total)upd();}};
  await Promise.all([worker(),worker(),worker(),worker()]);offRun=null;upd();
  toast(run.stop?"Abgebrochen – später weitermachen möglich":`Fertig: ${done-fail} Kartenbilder gespeichert${fail?", "+fail+" Fehler (nochmals starten)":""}`,6000);
  const s=$("#oStop");if(s)s.style.display="none";const g=$("#oGo");if(g)g.disabled=false;}


/* ---------- Familienseite (verschlüsselt, Variante A) ---------- */
const FAM_ITER=250000;
const famCfg=()=>{try{return JSON.parse(localStorage.getItem("rb_fam")||"{}");}catch(e){return {};}};
const famSave=c=>{try{localStorage.setItem("rb_fam",JSON.stringify(c));}catch(e){}};
const famReady=()=>{const c=famCfg();return !!(c.owner&&c.repo&&c.token&&c.pw);};
const famURL=c=>`https://${c.owner}.github.io/${c.repo}/`;
function b64(buf){const b=buf instanceof Uint8Array?buf:new Uint8Array(buf);let s="";for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const hex=b=>[...b].map(x=>x.toString(16).padStart(2,"0")).join("");
async function famKey(pw,salt){const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:FAM_ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt"]);}
async function famEnc(key,data){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,data));
  const out=new Uint8Array(12+ct.length);out.set(iv);out.set(ct,12);return out;}
async function gh(c,path,method="GET",body=null,allow404=false){
  const r=await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${path}`,{method,cache:"no-store",
    headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},body:body?JSON.stringify(body):undefined});
  if(r.status===404&&allow404)return null;
  if(r.status===401)throw new Error("GitHub-Schlüssel ungültig oder abgelaufen");
  if(r.status===403)throw new Error("GitHub-Schlüssel hat keine Schreibrechte für dieses Repository");
  if(r.status===404)throw new Error("Repository nicht gefunden – Name prüfen");
  if(!r.ok)throw new Error("GitHub antwortet mit Fehler "+r.status);
  return r.status===204?null:r.json();}
async function famPublish(){const c=famCfg();if(!famReady())return famSettings();
  if(!navigator.onLine)return toast("Kein Internet – später veröffentlichen",4000);
  const sp=points.filter(p=>p.story&&(!c.trip||p.trip===c.trip));
  try{
    if(!c.salt){c.salt=b64(crypto.getRandomValues(new Uint8Array(16)));famSave(c);}
    const tag=hex(unb64(c.salt)).slice(0,8);
    toast("Verschlüssle …",60000);const key=await famKey(c.pw,unb64(c.salt));
    /* 1. Familienseite selbst (nur Code, unverschlüsselt) */
    const viewer=new TextEncoder().encode(await(await fetch("ibexmap.intern.html",{cache:"no-store"})).text());
    const exV=await gh(c,"index.html","GET",null,true);
    if(!exV||!exV.content||exV.content.replace(/\n/g,"")!==b64(viewer))
      await gh(c,"index.html","PUT",{message:"Familienseite",content:b64(viewer),sha:exV?exV.sha:undefined});
    /* 2. Fotos (einzeln verschlüsselt, nur fehlende) */
    const list=await gh(c,"p","GET",null,true)||[];const remote=Object.fromEntries(list.map(f=>[f.name,f.sha]));
    const need=new Map();sp.forEach(p=>(p.photos||[]).forEach(id=>need.set(id+"_"+tag+".bin",id)));
    let i=0,up=0;
    for(const[fn,id]of need){i++;if(remote[fn])continue;const ph=await getOne("photos",id);if(!ph)continue;
      toast(`Fotos hochladen … (${i}/${need.size})`,60000);
      const enc=await famEnc(key,new Uint8Array(await ph.blob.arrayBuffer()));
      await gh(c,"p/"+fn,"PUT",{message:"Foto",content:b64(enc)});up++;}
    /* 3. Daten */
    const data={title:c.title||"Unsere Reise",updated:Date.now(),points:sp.map(p=>{const k=CATS[p.cat]||CATS.other;
      return {id:p.id,title:ptTitle(p),text:p.storyText||p.desc||"",date:p.visited||new Date(p.created||Date.now()).toISOString().slice(0,10),
        lat:p.lat,lon:p.lon,region:p.region||"",icon:k.i,color:k.c,photos:(p.photos||[]).filter(id=>need.has(id+"_"+tag+".bin")).map(id=>id+"_"+tag)};})};
    const enc=await famEnc(key,new TextEncoder().encode(JSON.stringify(data)));
    const file=new TextEncoder().encode(JSON.stringify({v:1,salt:c.salt,iter:FAM_ITER,data:b64(enc)}));
    const exD=await gh(c,"data.json","GET",null,true);
    await gh(c,"data.json","PUT",{message:"Storypoints",content:b64(file),sha:exD?exD.sha:undefined});
    /* 4. Nicht mehr verwendete Fotos entfernen */
    let rm=0;for(const[fn,sha]of Object.entries(remote))if(!need.has(fn)){await gh(c,"p/"+fn,"DELETE",{message:"Foto entfernt",sha}).catch(()=>{});rm++;}
    c.last=Date.now();famSave(c);
    toast(`Veröffentlicht: ${sp.length} Storypoints, ${up} neue Fotos${rm?", "+rm+" entfernt":""}. Sichtbar in ca. 1–2 Minuten.`,7000);
  }catch(e){toast("Veröffentlichen fehlgeschlagen: "+e.message,8000);}}
function famPw(){const a="abcdefghjkmnpqrstuvwxyz",d="23456789",w=[];const r=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;
  for(let k=0;k<4;k++){let x="";for(let j=0;j<4;j++)x+=a[r(a.length)];w.push(x);}return w.join("-")+"-"+d[r(d.length)]+d[r(d.length)];}
function famSettings(){const c=famCfg();const owner=c.owner||location.hostname.split(".")[0]||"";
  openPanel(`<h2>Familienseite einrichten</h2>
   <p class="muted">Eine eigene Seite für die Familie, z. B. <b>${esc(famURL({owner,repo:c.repo||"familie"}))}</b>. Dort liegen nur die markierten Storypoints – verschlüsselt. Die Familie braucht Link und Passwort.</p>
   <label>Reise</label><select id="fmTrip">${trips.map(t=>`<option value="${t.id}" ${(c.trip||curTrip)===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select>
   <label>Titel der Seite</label><input id="fmTitle" value="${esc(c.title||(tripOf(c.trip||curTrip)||{}).name||"Unsere Reise")}">
   <div class="row"><div><label>GitHub-Konto</label><input id="fmOwner" value="${esc(owner)}"></div><div><label>Repository</label><input id="fmRepo" value="${esc(c.repo||"")}" placeholder="z. B. familie"></div></div>
   <label>GitHub-Zugangsschlüssel (Fine-grained token)</label><input id="fmToken" type="password" value="${esc(c.token||"")}" placeholder="github_pat_…" autocomplete="off">
   <label>Familien-Passwort</label><div class="row"><input id="fmPw" value="${esc(c.pw||"")}" autocomplete="off"><button class="btn sec" id="fmGen" style="flex:none">Erzeugen</button></div>
   <p class="muted">Mindestens 14 Zeichen – am besten «Erzeugen». Wird das Passwort geändert, werden beim nächsten Veröffentlichen alle Fotos neu verschlüsselt hochgeladen; das alte Passwort funktioniert danach nicht mehr.</p>
   <div class="actions"><button class="btn" id="fmSave">Speichern</button>${famReady()?`<button class="btn sec" id="fmLink">Link + Passwort kopieren</button>`:""}<button class="btn sec" id="fmBack">Zurück</button>
   ${famReady()?`<button class="btn warn" id="fmDel">Einstellungen auf diesem Gerät löschen</button>`:""}</div>
   <p class="muted">Schlüssel und Passwort bleiben nur auf diesem Gerät gespeichert (werden nicht mit Google Drive abgeglichen). Veröffentlichen kann nur ein Gerät, auf dem das eingerichtet ist.</p>`);
  $("#fmGen").onclick=()=>{$("#fmPw").value=famPw();};
  $("#fmBack").onclick=()=>$("#navMenu").onclick();
  $("#fmSave").onclick=()=>{const n={trip:$("#fmTrip").value,title:$("#fmTitle").value.trim(),owner:$("#fmOwner").value.trim(),repo:$("#fmRepo").value.trim(),token:$("#fmToken").value.trim(),pw:$("#fmPw").value};
    if(!n.owner||!n.repo||!n.token)return toast("Bitte Konto, Repository und Schlüssel ausfüllen",4000);
    if(n.pw.length<14)return toast("Passwort zu kurz – mindestens 14 Zeichen",4000);
    const keepSalt=c.salt&&c.pw===n.pw&&c.owner===n.owner&&c.repo===n.repo;
    famSave(Object.assign(n,{salt:keepSalt?c.salt:"",last:keepSalt?c.last:0}));toast("Gespeichert");famSettings();};
  const l=$("#fmLink");if(l)l.onclick=async()=>{const t=`${c.title||"Unsere Reise"}\n${famURL(c)}\nPasswort: ${c.pw}`;
    try{await navigator.clipboard.writeText(t);toast("Kopiert – z. B. in WhatsApp einfügen",4000);}catch(e){toast(famURL(c)+"  Passwort: "+c.pw,10000);}};
  const d=$("#fmDel");if(d)d.onclick=()=>confirmBox("Schlüssel und Passwort auf diesem Gerät löschen? (Die Familienseite selbst bleibt bestehen.)",()=>{try{localStorage.removeItem("rb_fam");}catch(e){}toast("Gelöscht");$("#navMenu").onclick();});}

/* ---------- Update ---------- */
let swReg=null;
async function checkUpdate(){if(!navigator.onLine)return toast("Kein Internet",3000);toast("Suche Update …",5000);
  try{const r=await fetch("index.html",{cache:"no-store"});const t=await r.text();const m=t.match(/const VERSION="([^"]+)"/);
    if(swReg)await swReg.update().catch(()=>{});
    if(m&&m[1]!==VERSION){toast(`Neue Version ${m[1]} – wird geladen …`,3000);setTimeout(()=>location.reload(),800);}
    else toast(`Aktuell: ${VERSION} ist die neueste Version`,4000);}
  catch(e){toast("Update-Prüfung fehlgeschlagen",4000);}}
/* ---------- Start ---------- */
(async()=>{
  try{db=await openDB();}catch(e){toast("Speicher nicht verfügbar – Daten werden nicht gesichert",6000);return;}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  showSyncBtn();gdRestore();const _gdNew=gdFromRedirect();
  await loadMeta();
  await loadPoints();
  if(_gdNew||sessionStorage.getItem("rb_after_login")){try{sessionStorage.removeItem("rb_after_login");}catch(e){}if(gdToken)setTimeout(()=>syncDrive(),400);}
  try{const o=await getOne("meta","osmpoi");if(o)osmData={items:o.items||[],loaded:o.loaded,scope:o.scope||""};}catch(e){}drawOsm();
  if(points.length){const b=L.latLngBounds(points.map(p=>[p.lat,p.lon]));map.fitBounds(b,{padding:[30,30]});}
  startGPS();
  $("#ver").textContent=VERSION;
  if("serviceWorker" in navigator&&location.protocol==="https:"){
    const hadCtrl=!!navigator.serviceWorker.controller;let reloaded=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!hadCtrl||reloaded)return;reloaded=true;toast("Neue Version wird geladen …",3000);setTimeout(()=>location.reload(),600);});
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{swReg=r;r.update().catch(()=>{});}).catch(()=>{});
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&swReg)swReg.update().catch(()=>{});});}
})();
</script>
