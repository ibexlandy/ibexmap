<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#92b78c">
<title>IbexMap</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--sb:env(safe-area-inset-bottom,0px);--bg:#f4f1ea;--ink:#222;--muted:#6b6b6b;--accent:#2f3b2f;--accent2:#c8742c;--line:#d9d3c7;--card:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
#app{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{flex:none;display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top)) 6px 6px 10px;background:var(--accent);color:#fff;min-height:52px}
.hlogo{width:34px;height:34px;border-radius:8px;flex:none}
.htitle{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15;padding-left:4px}
.hname{font-size:18px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
#ver{font-size:11px;font-weight:400;opacity:.55;margin-left:2px}
.htrip{border:0;background:none;color:#fff;opacity:.8;font:inherit;font-size:13px;padding:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.htrip::after{content:" ▾";opacity:.7}
.hbtn{position:relative;flex:none;width:42px;height:42px;border:0;border-radius:50%;background:none;color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.hbtn:active{background:rgba(255,255,255,.15)}
.sdot{position:absolute;top:7px;right:7px;width:10px;height:10px;border-radius:50%;background:var(--accent2);border:2px solid #92b78c;display:none}
.hbtn.busy svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.gdot{position:absolute;right:8px;bottom:9px;width:9px;height:9px;border-radius:50%;background:#9e9e9e;border:2px solid var(--accent)}
#gpsInfo.ok .gdot{background:#4caf50}#gpsInfo.bad .gdot{background:#e53935}
@keyframes pulse{50%{opacity:.8}}
.bar{height:10px;background:#ddd;border-radius:5px;overflow:hidden;margin:10px 0}.bar div{height:100%;background:var(--accent2);width:0}
#map{flex:1;position:relative;min-height:0}
nav{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:var(--sb)}
nav button{border:0;background:none;padding:10px 4px 12px;font-size:13px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:22px;line-height:1}
nav button.primary{color:var(--accent2);font-weight:700}
nav button.on{color:var(--accent2)}
.fab.add{background:var(--accent2);color:#fff;font-size:28px;font-weight:700;width:56px;height:56px;right:8px}
#locBtn{bottom:calc(20px + var(--sb))}
.fab{display:flex;align-items:center;justify-content:center;color:var(--ink);position:absolute;right:12px;bottom:20px;z-index:500;width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3);font-size:22px}
.fab.follow{background:var(--accent2);color:#fff}
.fab.active{background:var(--accent);color:#fff}
.stars{display:inline-flex;gap:2px;vertical-align:middle}
.stars button{border:0;background:none;font-size:26px;line-height:1;padding:2px;color:#cfc8b8}
.stars button.on{color:#e0a100}
.rate{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px}
.rate .rrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:wrap}
.rate .rrow b{font-weight:600;font-size:14px}
.rate input{margin-top:4px;padding:6px 8px;font-size:14px}
.sv{color:#e0a100;letter-spacing:1px}
.clu{border-radius:50%;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;position:relative;font-size:18px}
.clu b{position:absolute;right:-6px;top:-6px;background:#222;color:#fff;font-size:11px;min-width:20px;height:20px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.ico{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none;vertical-align:middle}
.chip .ico{margin-right:4px}
.chip svg{vertical-align:-3px;margin-right:4px}
.lfh{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:10px 0 2px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin-top:4px}
.catgrid button{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;font:inherit;font-size:12px;color:var(--ink);line-height:1.2;text-align:center}
.catgrid button.on{border-color:var(--accent2);background:#fff6ec;font-weight:600}
.osmpin{border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:600;background:var(--accent2);color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.3);display:none}
.sheet{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;z-index:1000;background:rgba(0,0,0,.35);display:none}
.sheet.open{display:block}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:calc(24px + var(--sb)) !important;background:var(--bg);border-radius:16px 16px 0 0;padding:14px 16px 24px}
@media (min-width:900px){.panel{left:auto;right:0;top:0;bottom:0;width:440px;max-height:none;border-radius:0}}
/* Titelleiste und Leisten ebenfalls im Logo-Stil */
.hlogo{box-shadow:0 0 0 1px rgba(0,0,0,.25)}
header{background:#92b78c url(topo.svg) repeat;background-size:360px;color:#13200f;border-bottom:1px solid #6f9469}
header .htrip{color:#13200f}header .hbtn{color:#13200f}header .hbtn:active{background:rgba(0,0,0,.08)}
header #ver{opacity:.6}.gdot{border-color:#92b78c}
body #admTools{background:#b4cfae url(topo.svg) repeat;background-size:360px;border-bottom-color:#86a780}
body #admTools .acount{color:#334231}
.placebar,#offbar{background:#a9c7a3 url(topo.svg) repeat;background-size:360px}
.placebar .muted{color:#2c3a2a}
/* Hintergrund wie im Logo: Grün mit Höhenlinien */
.panel{background:#9fc099 url(topo.svg) repeat;--muted:#334231;--line:#86a780}
.panel .ptop{background:rgba(159,192,153,.94);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border-bottom-color:#86a780}
.panel .ptop .pgrab{background:#5f7f5a}
.panel h2,.panel h3,.panel .mgh{text-shadow:0 0 6px #9fc099,0 0 2px #9fc099}
.panel .mgh{color:#2f3b2f}
.panel hr{border:0;border-top:1px solid #86a780}
.panel input:not([type=checkbox]):not([type=radio]),.panel select,.panel textarea{border-color:#86a780}

.ptop{position:sticky;top:-14px;margin:-14px -16px 6px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.ptop .px{border:0;background:#fff;border-radius:50%;width:40px;height:40px;font-size:18px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.ptop .pback{border:0;background:none;font-size:16px;font-weight:600;color:var(--accent);padding:8px 6px}
.ptop .pgrab{width:40px;height:5px;border-radius:3px;background:#cfc8b8}
.panel h2{margin:4px 0 12px;font-size:19px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.panel input:not([type=checkbox]):not([type=radio]),.panel select,.panel textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
textarea{min-height:110px;resize:vertical}
.mgh{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 4px 6px}
.mgrp{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mrow{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:9px 12px;margin:0;background:none;border:0;border-top:1px solid var(--line);border-radius:0;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.mgrp>.mrow:first-child{border-top:0}
.mrow:active{background:#f1ede4}
.mic{flex:none;width:36px;height:36px;border-radius:9px;background:#e9eee6;color:var(--accent);display:flex;align-items:center;justify-content:center}
.mic svg{opacity:1 !important}
.mtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mtx b{font-size:15px;font-weight:600}
.mtx small{font-size:12.5px;color:var(--muted);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mchev{flex:none;color:var(--muted);display:flex}
.mact{flex:none;font-size:13px;font-weight:700;color:#fff;background:var(--accent);border-radius:16px;padding:7px 12px;white-space:nowrap}
.rdy{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px}
.rdy.ok{background:#2e9e44}.rdy.warn{background:#e0a100}.rdy.bad{background:#c62828}
button.mact{border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:700}
#admUndo{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:3000;background:#13200f;color:#fff;border-radius:12px;padding:10px 12px 10px 16px;display:none;align-items:center;gap:14px;box-shadow:0 4px 18px rgba(0,0,0,.35);font-size:14px}
#admUndo button{border:0;background:var(--accent2);color:#fff;font:inherit;font-weight:700;border-radius:8px;padding:7px 12px;display:flex;align-items:center;gap:6px;cursor:pointer}#admUndo svg{opacity:1 !important}
.mrow.main .mic{background:var(--accent);color:#fff}
.msw{appearance:none;-webkit-appearance:none;flex:none;width:44px;height:26px;border-radius:13px;background:#cfc9bc;position:relative;margin:0;cursor:pointer;transition:background .15s}
.msw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.msw:checked{background:var(--accent)}.msw:checked::after{left:21px}
body.adm #app{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,30%);grid-template-rows:auto minmax(0,1fr)}
body.adm header{grid-column:1/3}
body.adm.nomap #app{grid-template-columns:minmax(0,1fr) 0}body.adm.nomap #map{visibility:hidden;border:0}
body.adm #map{grid-column:2;grid-row:2;border-left:1px solid var(--line)}
body.adm #map>.fab,body.adm .hint{display:none !important}
body.adm #locBtn{display:flex !important}
.hadm{font-size:12px;font-weight:600;background:var(--accent2);color:#fff;border-radius:6px;padding:2px 7px;vertical-align:3px;margin-left:4px}
.hbtn.hwide{width:auto;border-radius:20px;padding:0 12px;gap:6px;font:inherit;font-size:14px;font-weight:600}.hbtn.hwide svg{opacity:1 !important}
#adm{grid-column:1;grid-row:2;display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}
#admTools{flex:none;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:#fff}
.asearch{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:#fff;flex:1 1 200px;color:var(--muted)}
.asearch input{border:0;outline:0;font:inherit;font-size:14px;padding:8px 0;flex:1;min-width:0;background:none}
.abtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.abtn:hover{background:#f6f3ec}.abtn.on{border-color:var(--accent);background:#e9eee6;font-weight:600}.abtn b{background:var(--accent);color:#fff;border-radius:9px;padding:0 6px;font-size:11px}
.abtn.warn{color:#a33;border-color:#e2b9b9}.abtn svg{opacity:1 !important}
.alink{border:0;background:none;color:var(--accent2);font:inherit;font-size:13px;cursor:pointer;padding:6px 4px;text-decoration:underline}
.afb{position:relative}
.adrop{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:900;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:6px;min-width:230px;max-height:60vh;overflow:auto}
.adrop.open{display:block}
.adrop label{display:flex;align-items:center;gap:8px;margin:0;padding:6px 8px;border-radius:6px;font-size:14px;color:var(--ink);cursor:pointer}
.adrop label:hover{background:#f4f1ea}.adrop label>span{flex:1;display:flex;align-items:center;gap:6px}.adrop label i{font-style:normal;color:var(--muted);font-size:12px}
.acount{margin-left:auto;font-size:13px;color:var(--muted);white-space:nowrap}
#admBulk{flex:none;display:none;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:#fff6ec;border-bottom:1px solid #ecd3b8;font-size:14px}
#admBulk select{font:inherit;font-size:13.5px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
#admTable{flex:1;overflow:auto;min-height:0}
#admTable table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px;background:#fff}
#admTable th{position:sticky;top:0;z-index:2;background:#f4f1ea;text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
#admTable th.on{color:var(--ink)}#admTable th:hover{color:var(--ink)}
#admTable td{padding:3px 6px;border-bottom:1px solid #eee8dc;vertical-align:middle;white-space:nowrap}
#admTable tr:hover td{background:#faf8f3}#admTable tr.sel td{background:#fff6ec}#admTable tr.cur td{background:#e9eee6}
#admTable td select,#admTable td input[data-e="title"]{font:inherit;font-size:13.5px;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 2px;color:var(--ink);max-width:135px}
#admTable td select:hover,#admTable td input[data-e="title"]:hover{border-color:var(--line);background:#fff}
#admTable td select:focus,#admTable td input[data-e="title"]:focus{border-color:var(--accent);background:#fff;outline:0}
#admTable td.atitle{min-width:240px}#admTable .atitle>div{display:flex;align-items:center;gap:6px}
#admTable .atitle input{flex:1;min-width:0;max-width:none !important;font-weight:600}
#admTable .ack{width:30px;text-align:center}#admTable .ack input{width:16px;height:16px;cursor:pointer}
#admTable .atxt{color:#444;max-width:140px;overflow:hidden;text-overflow:ellipsis}#admTable .atxt small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis}#admTable .adate{color:var(--muted);font-size:12.5px}
.astars button{border:0;background:none;padding:0 1px;font-size:16px;color:#d6cfbf;cursor:pointer}.astars button.on{color:#e0a100}
.aph div{display:flex;align-items:center;gap:4px}.aph img{width:34px;height:34px;object-fit:cover;border-radius:5px;background:#eee}.aph span{font-size:12px;color:var(--muted)}
.aact button{border:0;background:none;color:var(--accent);padding:5px;border-radius:6px;cursor:pointer;display:inline-flex}.aact button:hover{background:#e9eee6}.aact svg{opacity:1 !important}
.mrow.wrap small{white-space:normal}
.oact button{width:32px;justify-content:center;padding:7px 0 !important}
.oact{flex:none;display:flex;gap:2px}.oact button{border:0;background:none;color:var(--accent);padding:7px;border-radius:8px;cursor:pointer;display:inline-flex}.oact button:hover{background:#e9eee6}.oact svg{opacity:1 !important}
.ocalc{margin-top:14px;padding:10px 12px;border-radius:10px;background:#e9eee6;font-size:14px}.ocalc.bad{background:#fde7e7;color:#a33}
#offframe{position:absolute;left:8%;right:8%;top:70px;bottom:150px;z-index:640;border:3px dashed var(--accent2);border-radius:6px;pointer-events:none;display:none;box-shadow:0 0 0 2000px rgba(0,0,0,.12)}
#offPill{position:absolute;left:50%;transform:translateX(-50%);top:12px;z-index:650;display:none;border:0;background:var(--accent);color:#fff;font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:18px;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer}
.pth{width:64px;height:64px;flex:none;border-radius:8px;background:#e3e9e1 center/cover;cursor:zoom-in;display:flex;align-items:center;justify-content:center;color:#888}
.panel select.pnew{width:auto;max-width:175px;flex:none;font-size:13px;padding:6px 6px}.panel select.pnew.on{border-color:var(--accent2);background:#fff6ec;font-weight:600}
.pbx{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:20px}
.pbig{position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;cursor:zoom-out}.pbig img{max-width:96vw;max-height:94vh;border-radius:6px}
.bigpage{position:fixed;inset:0;z-index:1400;background:#eef3ec;display:none;flex-direction:column}
.bpbody{flex:1;overflow:auto;padding:12px 14px 30px}
.bpsum{margin:2px 2px 10px;font-size:14px}
.bpopt{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:#13200f;margin:0}
.bpopt select{font:inherit;font-size:13.5px;padding:6px 6px;border:1px solid #6f9469;border-radius:8px;background:#fff}
.bpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.bpcard{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 6px rgba(0,0,0,.1);position:relative;border:3px solid transparent;opacity:.75}
.bpcard.on{border-color:var(--accent2);opacity:1}
.bpimg{aspect-ratio:4/3;background:#dfe6dc center/cover;cursor:zoom-in}
.bpchk{position:absolute;top:8px;right:8px;background:#fff;border-radius:8px;padding:5px;box-shadow:0 1px 4px rgba(0,0,0,.3);margin:0;display:flex}
.bpchk input{width:22px;height:22px;margin:0}
.bptx{padding:8px 10px}.bptx b{display:block;font-size:14px}.bptx small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bprest{background:#fff6ec;border:1px solid #ecd3b8;border-radius:12px;padding:12px 14px;margin-top:16px}.bprest small{display:block;color:var(--muted);margin-top:2px}
@media (max-width:899px){.bpgrid{grid-template-columns:repeat(2,1fr);gap:8px}.wzbar .bpopt{font-size:12.5px}}
#wiz{position:fixed;inset:0;z-index:1400;background:#eef3ec;display:none;flex-direction:column}
.wzbar{flex:none;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:#92b78c url(topo.svg) repeat;background-size:360px;border-bottom:1px solid #6f9469;flex-wrap:wrap}
.wzbar b{font-size:16px;color:#13200f}.wzbar .btn{padding:9px 14px}.abtn:disabled{opacity:.4}
.wzbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(360px,1fr);gap:0}
.wzpics{display:flex;flex-direction:column;min-height:0;background:#1b2219}
.wzbig{flex:1;min-height:0;background:#1b2219 center/contain no-repeat}
.wzth{flex:none;display:flex;gap:6px;padding:8px;overflow-x:auto;background:#141a13}
.wzth .t{width:84px;height:64px;flex:none;border-radius:6px;background:#333 center/cover;position:relative;cursor:pointer;border:2px solid transparent}
.wzth .t.on{border-color:var(--accent2)}.wzth .t.off{opacity:.3}
.wzth .t span{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.wzform{overflow:auto;padding:12px 16px 30px;background:#f4f7f2}
#wzMap{height:260px;border-radius:12px;border:1px solid var(--line);margin-bottom:6px}
.wzform label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.wzform input:not([type=checkbox]),.wzform select,.wzform textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid #c9d4c5;border-radius:8px;background:#fff}

function tx(store,mode,fn){return new Promise((res,rej)=>{const t=db.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error);});}
const getAll=st=>new Promise((res,rej)=>{const r=db.transaction(st).objectStore(st).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});

const COUNTRY_SRC="https://cdn.jsdelivr.net/gh/nvkelso/natural-earth-vector@v5.1.2/geojson/ne_50m_admin_0_countries.geojson";
let countryData=null;
const DN=(()=>{try{return new Intl.DisplayNames(["de"],{type:"region"});}catch(e){return null;}})();
function countryName(code){if(!code)return "";try{const n=DN&&DN.of(code);if(n&&n!==code)return n;}catch(e){}
  const f=(countryData||[]).find(x=>x.c===code);return f?f.n:code;}
function prepCountries(){(countryData||[]).forEach(f=>{if(f.b)return;let a=180,b=90,c=-180,d=-90;
  const polys=f.g.type==="Polygon"?[f.g.coordinates]:f.g.coordinates;
  polys.forEach(p=>p[0].forEach(([x,y])=>{if(x<a)a=x;if(y<b)b=y;if(x>c)c=x;if(y>d)d=y;}));f.b=[a,b,c,d];});}
async function downloadCountries(){const fc=await(await fetch(COUNTRY_SRC)).json();
  const r=v=>Math.round(v*1000)/1000,rd=g=>g.type==="Polygon"?{type:"Polygon",coordinates:g.coordinates.map(ring=>ring.map(([x,y])=>[r(x),r(y)]))}
    :{type:"MultiPolygon",coordinates:g.coordinates.map(pl=>pl.map(ring=>ring.map(([x,y])=>[r(x),r(y)])))};
  countryData=fc.features.filter(f=>f.geometry).map(f=>{const P=f.properties||{};
    let c=[P.ISO_A2_EH,P.ISO_A2,P.WB_A2].find(v=>v&&/^[A-Z]{2}$/.test(v))||"";
    return {c,n:P.NAME_DE||P.NAME||c,g:rd(f.geometry)};}).filter(f=>f.c);
  await put("meta",{id:"countries",data:countryData,loaded:Date.now()});prepCountries();return countryData.length;}
function countryAt(lat,lon){for(const f of countryData||[]){const b=f.b;if(b&&(lon<b[0]||lon>b[2]||lat<b[1]||lat>b[3]))continue;if(inGeom(lon,lat,f.g))return f.c;}return "";}
function countryOf(lat,lon){if(!countryData)return "";let c=countryAt(lat,lon);if(c)return c;
  /* Punkt knapp im Meer (Küste, Hafen): Umgebung absuchen */
  for(const d of [0.02,0.05,0.1])for(const[dy,dx]of[[d,0],[-d,0],[0,d],[0,-d],[d,d],[-d,-d],[d,-d],[-d,d]]){c=countryAt(lat+dy,lon+dx);if(c)return c;}return "";}
async function assignCountries(){let n=0;for(const p of await getAll("points"))if(!p.deleted&&!p.country){const c=countryOf(p.lat,p.lon);if(c){p.country=c;await put("points",p);n++;}}

async function ensureCountries(){if(countryData||!navigator.onLine)return;try{await downloadCountries();await assignCountries();}catch(e){}}

function slim(fc){return fc.features.map(f=>({n:nameOf(f.properties)||String(f.id||""),g:f.geometry}));}
async function downloadRegions(){
  await loadScript("https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js");
  const out={};
  for(const [k,u] of Object.entries(REGION_SRC)){const topo=await (await fetch(u)).json();let feats=[];
    for(const key of Object.keys(topo.objects)){const fc=topojson.feature(topo,topo.objects[key]);feats=feats.concat(fc.type==="FeatureCollection"?slim(fc):slim({features:[fc]}));}
    out[k]=feats;}
  regionData=out;await put("meta",{id:"regions",data:out,loaded:Date.now()});return out;}
function inRing(x,y,ring){let ins=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
  if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins;}return ins;}
function inGeom(x,y,g){if(!g)return false;const polys=g.type==="Polygon"?[g.coordinates]:g.type==="MultiPolygon"?g.coordinates:[];
  return polys.some(p=>inRing(x,y,p[0])&&!p.slice(1).some(h=>inRing(x,y,h)));}
function regionOf(lat,lon){if(!regionData)return "";const f=list=>(list||[]).find(e=>inGeom(lon,lat,e.g));
  const pr=f(regionData.prov),rg=f(regionData.reg);return [pr&&pr.n,rg&&rg.n].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).join(" · ");}

function tileFallback(e){const lay=e.target,t=e.tile,c=e.coords;if(!t||t.dataset.fb)return;t.dataset.fb="1";
  const tryK=k=>{if(k>6||c.z-k<0)return;const pc={x:c.x>>k,y:c.y>>k,z:c.z-k};const im=new Image();im.crossOrigin="anonymous";
    im.onload=()=>{try{const cv=document.createElement("canvas");cv.width=cv.height=256;const sz=256/(1<<k);
      cv.getContext("2d").drawImage(im,(c.x-(pc.x<<k))*sz,(c.y-(pc.y<<k))*sz,sz,sz,0,0,256,256);t.src=cv.toDataURL("image/jpeg",0.85);t.style.opacity=1;}catch(err){}};
    im.onerror=()=>tryK(k+1);im.src=lay.getTileUrl(pc);};
  tryK(1);}

function drawPoints(){layer.clearLayers();

       if(b.getNorthEast().equals(b.getSouthWest()))map.setView(b.getCenter(),CLUSTER_MAXZOOM);else map.fitBounds(b,{padding:[50,50],maxZoom:CLUSTER_MAXZOOM});});}}

function osmType(t){if(t.amenity==="fuel")return "fuel";
  if(/^(drinking_water|water_point|fountain)$/.test(t.amenity||"")||/^(water_tap|water_well)$/.test(t.man_made||"")||t.natural==="spring")return "water";
  if(/^(car_repair|tyres|car_parts)$/.test(t.shop||"")||t.craft==="mechanic"||t.service==="tyres")return "service";

function osmKind(t){const m={supermarket:"Supermarkt",convenience:"Laden / Hanout",general:"Gemischtwaren",greengrocer:"Gemüse/Obst",car_repair:"Autowerkstatt",tyres:"Reifen / Vulkaniseur",car_parts:"Autoteile"};

const KEEP=["drinking_water","natural","man_made","name","name:fr","name:ar","brand","opening_hours","phone","contact:phone","website","addr:city","addr:street","fuel:diesel","shop","amenity","craft","service"];
function osmQuery(scope){const cc=/^[A-Z]{2}$/.test(scope);const f=cc?"(area.a)":`(${scope})`;
  return `[out:json][timeout:240];${cc?`area["ISO3166-1"="${scope}"][admin_level=2]->.a;`:""}(`+
   `nwr["shop"~"^(supermarket|convenience|general|greengrocer|car_repair|tyres|car_parts)$"]${f};`+
   `nwr["amenity"="fuel"]${f};nwr["craft"="mechanic"]${f};`+
   `nwr["amenity"~"^(drinking_water|water_point|fountain)$"]${f};nwr["man_made"~"^(water_tap|water_well)$"]${f};node["natural"="spring"]${f};);out center tags;`;}
async function osmFetch(scope){let last;
  for(const ep of OVERPASS){try{const r=await fetch(ep,{method:"POST",body:"data="+encodeURIComponent(osmQuery(scope)),headers:{"Content-Type":"application/x-www-form-urlencoded"}});
      if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();
      return j.elements.map(e=>{const t=e.tags||{};const k={};KEEP.forEach(x=>{if(t[x])k[x]=t[x];});
        const lat=e.lat??(e.center&&e.center.lat),lon=e.lon??(e.center&&e.center.lon);
        return {id:e.type[0]+e.id,lat,lon,ty:osmType(t),t:k};}).filter(x=>x.ty&&x.lat!=null);}

function refPos(){if(me)return {lat:me.lat,lon:me.lon,src:"Standort"};

function gpsState(cls,txt){const b=$("#gpsInfo");b.classList.remove("ok","bad");if(cls)b.classList.add(cls);b.title=txt;b.dataset.txt=txt;}

function startGPS(){
  if(!("geolocation" in navigator)){gpsState("bad","Kein GPS");return;}
  if(watchId!==null)return;
  watchId=navigator.geolocation.watchPosition(pos=>{
    me={lat:pos.coords.latitude,lon:pos.coords.longitude,acc:pos.coords.accuracy};
    if(!lastPosT||Date.now()-lastPosT>30000){lastPosT=Date.now();try{localStorage.setItem("rb_lastpos",JSON.stringify({lat:me.lat,lon:me.lon,t:lastPosT}));}catch(e){}}

    if(!meMarker){meMarker=L.circleMarker([me.lat,me.lon],{radius:8,color:"#fff",weight:3,fillColor:"#1e88e5",fillOpacity:1}).addTo(map);
      meCircle=L.circle([me.lat,me.lon],{radius:me.acc,color:"#1e88e5",weight:1,fillOpacity:.1}).addTo(map);}
    else{meMarker.setLatLng([me.lat,me.lon]);meCircle.setLatLng([me.lat,me.lon]).setRadius(me.acc);}

  {enableHighAccuracy:true,maximumAge:5000,timeout:30000});

function distKm(a,b){const R=6371,r=x=>x*Math.PI/180;const dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon);
  const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}

const ovCache=new Map();

  const q=`[out:json][timeout:25];(${parts});out center tags qt 80;`;

    fetch(ep,{method:"POST",signal:ac.signal,body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"}})
      .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})

      .catch(e=>{clearTimeout(to);rej(e);});});
  /* zwei Server sofort, die weiteren nach 4 s dazu */
  const tries=[one(OVERPASS[0]),one(OVERPASS[1]),new Promise((res,rej)=>setTimeout(()=>Promise.any(OVERPASS.slice(2).map(one)).then(res,rej),4000))];
  try{const j=await Promise.any(tries);ctrls.forEach(c=>{try{c.abort();}catch(e){}});

function guessCat(t){t=(t||"").toLowerCase();

  if(/afriquia|shell|total|petrom|ziz|winxo|station[- ]service|tankstelle|gas station|fuel/.test(t))return "fuel";
  if(/marjane|carrefour|bim\b|aswak|supermar|épicerie|hanout|supermarket|lidl|aldi|migros|coop/.test(t))return "shop";
  if(/garage|mécani|mecani|pneu|vulcan|werkstatt|repair|auto parts/.test(t))return "service";
  if(/source|fontaine|brunnen|water|eau potable/.test(t))return "water";
  if(/trail|randonn|wander|hike|gorge|sommet|peak/.test(t))return "hike";
  return "sight";}
function coordsFromUrl(u){if(!u)return null;let m;

  if((m=u.match(/[?&](?:q|query|ll|destination)=(-?\d+\.\d+)(?:,|%2C)\s*(-?\d+\.\d+)/i)))return [+m[1],+m[2]];

const OLC_A="23456789CFGHJMPQRVWX";

async function handleShare(){const q=new URLSearchParams(location.search);if(!q.has("st")&&!q.has("sx")&&!q.has("su"))return;

    let n=0,miss=[];
    for(let i=0;i<todo.length;i++){const x=todo[i];let ll=x.ll;
      if(!ll){toast(`Suche Orte … (${i+1}/${todo.length})`,60000);ll=await geocode([x.name,x.addr].filter(Boolean).join(", "))||(x.addr?await geocode(x.addr):null);await sleep(1100);}
      if(!ll){miss.push(x.name);continue;}
      await put("points",newPoint(+(+ll[0]).toFixed(6),+(+ll[1]).toFixed(6),{title:x.name||"",desc:[x.addr,x.note].filter(Boolean).join("\n"),source:x.url||"",cat:guessCat((x.name||"")+" "+(x.addr||"")),status:"idee"}));n++;}
    await loadPoints();
    if(miss.length)openPanel(`<h2>Google-Import</h2><p>${n} Orte übernommen.</p><p class="muted">Nicht gefunden (bitte von Hand setzen):</p><ul>${miss.map(m=>`<li>${esc(m)}</li>`).join("")}</ul>`);
    else toast(`${n} Orte übernommen`,5000);});}
function googleFromGeoJSON(fc){return (fc.features||[]).map(f=>{const P=f.properties||{},L0=P.location||P.Location||{};const g=f.geometry&&f.geometry.coordinates;
  let ll=g&&g.length>=2&&(g[0]||g[1])?[g[1],g[0]]:null;const url=P.google_maps_url||P["Google Maps URL"]||"";if(!ll)ll=coordsFromUrl(url);
  return {name:L0.name||L0["Business Name"]||P.Title||P.name||"",addr:L0.address||L0.Address||P.address||"",note:P.Comment||P.comment||"",url,ll};}).filter(x=>x.name||x.ll);}
function googleFromCSV(t){const rows=parseCSV(t);if(rows.length<2)return [];const h=rows[0].map(x=>x.trim().toLowerCase());
  const ix=k=>h.findIndex(x=>k.includes(x));const iT=ix(["title","titel","name"]),iN=ix(["note","notiz","comment","kommentar"]),iU=ix(["url"]);
  return rows.slice(1).map(r=>{const url=iU>=0?r[iU]:"";return {name:iT>=0?r[iT]:"",note:iN>=0?r[iN]:"",url,addr:"",ll:coordsFromUrl(url)};}).filter(x=>x.name);}

  await renderDraftPhotos();

    if(cr){const r={};for(const[k,,ty]of cr){const v=draftRate[k]||{};if(ty){if(isOn(v)||v.t)r[k]={b:isOn(v),t:v.t||""};}else if(v.s||v.t)r[k]={s:v.s||0,t:v.t||""};}p.rate=r;p.stars=draftStars||0;}
    if($("#fCat").value==="water")p.water=$("#fWater").value;
    p.imp=$("#fImp").checked||undefined;p.story=$("#fStory").checked;p.storyText=$("#fStoryText").value.trim();
    Object.assign(p,{title:$("#fTitle").value.trim(),cat:$("#fCat").value,status:$("#fStatus").value,section:sec,region:regionOf(lat,lon)||p.region||"",
      desc:$("#fDesc").value,note:$("#fNote").value,source:$("#fSource").value.trim(),lat,lon,photos:draftPhotos,updated:Date.now()});
    if(p.status==="besucht")p.visited=$("#fVisited").value||p.visited||new Date().toISOString().slice(0,10);
    {const t=$("#fVisTo").value;if(p.status==="besucht"&&STAY.includes(p.cat)&&t&&nights(p.visited,t)>0)p.visitedTo=t;else delete p.visitedTo;}
    await put("points",p);try{navigator.storage?.persist?.();}catch(e){}
    await loadPoints();toast("Gespeichert");showDetail(p.id);};
  const d=$("#fDel");if(d)d.onclick=()=>confirmBox(`«${esc(ptTitle(p))}» in den Papierkorb legen? (30 Tage wiederherstellbar)`,async()=>{await trashPoint(p);await loadPoints();closePanel();toast("Gelöscht");});
}
async function renderDraftPhotos(){const box=$("#fPhotos");if(!box)return;let h="";

function confirmBox(text,onYes){const old=$("#cBox");if(old)old.remove();

const crossIcon=L.divIcon({className:"",iconSize:[64,120],iconAnchor:[32,32],html:`<div class="xh">

function pbInfo(){if(!cross)return;const ll=cross.getLatLng();$("#pbInfo").textContent=`${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)} · am Griff ✥ ziehen`;}
function setPlacing(on){placing=on;if(!on){placeMode="point";}const pk=document.getElementById("pbOk");if(pk)pk.textContent=placeMode==="flag"?"Fahne hier setzen":"✓ Punkt hier setzen";$("#hint").style.display=on&&!cross?"block":"none";map.getContainer().classList.toggle("placing",on);
  if(!on){if(cross){map.removeLayer(cross);cross=null;}$("#placebar").style.display="none";}}
function putCross(ll){if(!cross){cross=L.marker(ll,{icon:crossIcon,draggable:true,autoPan:true,zIndexOffset:2000,keyboard:false}).addTo(map);cross.on("drag",pbInfo);}
  else cross.setLatLng(ll);$("#hint").style.display="none";$("#placebar").style.display="block";pbInfo();}
$("#hintCancel").onclick=e=>{e.stopPropagation();setPlacing(false);};
$("#pbNo").onclick=e=>{e.stopPropagation();placeExtra=null;placeMode="point";setPlacing(false);};
let placeExtra=null;
function startPlace(ll,mode){setPlacing(false);setPlacing(true);placeMode=mode||"point";
  $("#pbOk").textContent=placeMode==="flag"?"Fahne hier setzen":"✓ Punkt hier setzen";putCross(ll);}
$("#pbOk").onclick=e=>{e.stopPropagation();if(!cross)return;const ll=cross.getLatLng();
  if(placeMode==="flag"){placeMode="point";setPlacing(false);addFlag(ll.lat,ll.lng);return;}
  const ex=placeExtra;placeExtra=null;setPlacing(false);
  const p=newPoint(+ll.lat.toFixed(6),+ll.lng.toFixed(6),ex||{});if(ex&&ex.cat==="camp"&&!p.section)p.section=sectorOf(p.lat,p.lon);editPoint(p,true);};
L.DomEvent.disableClickPropagation($("#placebar"));
map.on("click",e=>{if(!placing)return;putCross(e.latlng);});
map.on("contextmenu",e=>{if(placing)return;const ll=e.latlng;

  setTimeout(()=>{$("#cxFlag").onclick=()=>{map.closePopup();startPlace(ll,"flag");};$("#cxPoint").onclick=()=>{map.closePopup();startPlace(ll,"point");};},30);});
$("#navHere").onclick=()=>{
  const go=pos=>{const d=new Date();const t=`Stellplatz ${fmtDT(d)}`;
    editPoint(newPoint(+pos.lat.toFixed(6),+pos.lon.toFixed(6),{title:t,cat:"wild",status:"besucht",visited:d.toISOString().slice(0,10)}),true);};

/* ---------- Liste ---------- */
/* Liste: Mehrfachauswahl je Gruppe (innerhalb einer Gruppe «oder», zwischen Gruppen «und») */
let fText="";const LF={cat:new Set(),st:new Set(),trip:new Set(),cc:new Set(),sec:new Set(),stars:new Set()};
const lfAny=()=>Object.values(LF).some(x=>x.size);
$("#navList").onclick=()=>showList();
async function showList(){const keepL=isPanelOpen()&&$("#lSearch")?$("#panel").scrollTop:0;setTimeout(()=>{if($("#lSearch"))$("#panel").scrollTop=keepL;},0);
  const chip=(grp,val,label,extra="")=>`<button class="chip ${LF[grp].has(val)?"on":""}" data-g="${grp}" data-v="${esc(val)}">${extra}${label}</button>`;
  const cnt=f=>points.filter(f).length;
  const countries=[...new Set(points.map(p=>p.country).filter(Boolean))].sort((a,b)=>countryName(a).localeCompare(countryName(b)));
  const secTrips=LF.trip.size?trips.filter(t=>LF.trip.has(t.id)):[curTripObj()].filter(Boolean);
  const secs=[...new Set(secTrips.flatMap(t=>t.sections||[]))];
  openPanel(`<h2>Punkte (${points.length})</h2>
    <input id="lSearch" placeholder="Suchen …" value="${esc(fText)}">
    ${lfAny()?`<div class="chips"><button class="chip" id="lfReset" style="border-color:var(--accent2);color:var(--accent2)">✕ Alle Filter zurücksetzen</button></div>`:""}
    <div class="lfh">Kategorie</div><div class="chips">${Object.entries(CATS).map(([k,v])=>chip("cat",k,esc(v.n),icoBadge(k,v.c,20))).join("")}</div>
    <div class="lfh">Bewertung</div><div class="chips">${[["3","ab ★★★"],["4","ab ★★★★"],["5","★★★★★"]].map(([v,l])=>chip("stars",v,`${l} (${cnt(p=>(p.stars||0)>=+v)})`)).join("")}</div>
    <div class="lfh">Status</div><div class="chips">${Object.entries(STATUS).map(([k,v])=>chip("st",k,esc(v))).join("")}</div>
    <div class="lfh">Reise</div><div class="chips">${tripsSorted().map(t=>chip("trip",t.id,`${esc(t.name)} (${cnt(p=>p.trip===t.id)})${t.hidden?" "+hidI:""}`)).join("")}${chip("trip","__none",`ohne Reise (${cnt(p=>!p.trip)})`)}</div>
    ${countries.length?`<div class="lfh">Land</div><div class="chips">${countries.map(c=>chip("cc",c,`${esc(countryName(c))} (${cnt(p=>p.country===c)})`,mi("globe",15))).join("")}</div>`:""}
    ${secs.length?`<div class="lfh">Abschnitt</div><div class="chips">${secs.map(x=>chip("sec",x,esc(x))).join("")}</div>`:""}
    <div class="lfh">Sortierung</div><div class="chips">${[["dist","Nächste zuerst"],["new","Neueste zuerst"],["old","Älteste zuerst"],["stars","Beste Bewertung"]].map(([k,t])=>`<button class="chip ${lSort===k?"on":""}" data-so="${k}">${t}</button>`).join("")}</div><div id="lItems"></div>`);
  $("#panel").querySelectorAll("[data-so]").forEach(b=>b.onclick=()=>{lSort=b.dataset.so;try{localStorage.setItem("rb_lsort",lSort);}catch(e){}showList();});
  $("#panel").querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const S=LF[b.dataset.g],v=b.dataset.v;S.has(v)?S.delete(v):S.add(v);
    if(b.dataset.g==="trip")LF.sec.clear();const sc=$("#panel").scrollTop;showList().then(()=>{$("#panel").scrollTop=sc;});});
  const rs=$("#lfReset");if(rs)rs.onclick=()=>{Object.values(LF).forEach(x=>x.clear());showList();};
  $("#lSearch").oninput=e=>{fText=e.target.value;renderItems();};
  renderItems();
}
let lSort="dist";try{lSort=localStorage.getItem("rb_lsort")||"dist";}catch(e){}
async function renderItems(){
  const q=fText.toLowerCase();
  const inS=(S,v)=>!S.size||S.has(v);
  let list=points.filter(p=>(!LF.trip.size||LF.trip.has(p.trip||"__none"))&&(LF.trip.has(p.trip)||!tripHidden(p.trip))&&inS(LF.cc,p.country)&&inS(LF.cat,p.cat in CATS?p.cat:"other")&&inS(LF.st,p.status||"idee")&&inS(LF.sec,p.section)&&(!LF.stars.size||(p.stars||0)>=Math.min(...[...LF.stars].map(Number)))&&(!q||(ptTitle(p)+" "+p.desc+" "+p.section+" "+(p.region||"")+" "+countryName(p.country)+" "+tripName(p.trip)+" "+p.note).toLowerCase().includes(q)));
  const dkey=p=>p.visited?new Date(p.visited+"T12:00:00").getTime():(p.created||0);
  const rp=refPos();
  if(lSort==="dist")list=list.map(p=>({p,d:distKm(rp,p)})).sort((a,b)=>a.d-b.d).map(x=>x.p);
  else if(lSort==="new")list.sort((a,b)=>dkey(b)-dkey(a));
  else if(lSort==="old")list.sort((a,b)=>dkey(a)-dkey(b));
  else if(lSort==="stars")list.sort((a,b)=>(b.stars||0)-(a.stars||0)||dkey(b)-dkey(a));
  let h=lSort==="dist"&&list.length?`<p class="muted" style="font-size:13px;margin:4px 0 8px">Nächste zuerst – ab ${esc(rp.src)}</p>`:"";
  for(const p of list){const c=CATS[p.cat]||CATS.other;const u=p.photos?.length?await photoURL(p.photos[0]):"";
    h+=`<div class="item" data-id="${p.id}">${u?`<img src="${u}">`:`<div class="noimg" style="background:${c.c}">${svgI(p.cat in CATS?p.cat:"other",34)}</div>`}
      <div><div class="t">${p.status==="besucht"?`<span class="lchk">✓</span>`:""}${p.story?`<span class="lstory">${storyI(10)}</span>`:""}${esc(ptTitle(p))}${p.stars&&RATE[p.cat]?` <span class="sv" style="font-weight:400;font-size:13px">${starTxt(p.stars)}</span>`:""}</div><div class="s"><span class="dot" style="background:${c.c}"></span>${esc(c.n)} · ${esc(STATUS[p.status]||"")}${p.section?" · "+esc(p.section):""} · ${esc(fmtD(p.visited||p.created))}${" · "+distKm(rp,p).toFixed(0)+" km"}</div></div></div>`;}
  $("#lItems").innerHTML=h||`<p class="muted">Keine Punkte gefunden.</p>`;
  $("#lItems").querySelectorAll(".item").forEach(e=>e.onclick=()=>showDetail(e.dataset.id));
}

$("#navMenu").onclick=async()=>{
  let mb="";try{const s=await navigator.storage.estimate();mb=`${(s.usage/1048576).toFixed(0)} MB belegt`;}catch(e){}

/* ---------- OsmAnd-Backup (.osf = ZIP) lesen: Favoriten und Fotos ---------- */
async function isZip(f){try{const b=new Uint8Array(await f.slice(0,4).arrayBuffer());return b[0]===0x50&&b[1]===0x4B&&b[2]===3&&b[3]===4;}catch(e){return false;}}
async function zipEntries(file){const sz=file.size;const tail=new DataView(await file.slice(Math.max(0,sz-70000),sz).arrayBuffer());
  let e=-1;for(let i=tail.byteLength-22;i>=0;i--)if(tail.getUint32(i,true)===0x06054b50){e=i;break;}
  if(e<0)throw new Error("Keine gültige OsmAnd-Datei (ZIP)");

    if(l>=0){const z64=Number(tail.getBigUint64(l+8,true));const r=new DataView(await file.slice(z64,z64+56).arrayBuffer());n=Number(r.getBigUint64(32,true));cdSize=Number(r.getBigUint64(40,true));cdOff=Number(r.getBigUint64(48,true));}}
  const cd=new DataView(await file.slice(cdOff,cdOff+cdSize).arrayBuffer());const out=[];let o=0;const td=new TextDecoder();
  for(let k=0;k<n&&o<cd.byteLength;k++){if(cd.getUint32(o,true)!==0x02014b50)break;
    const method=cd.getUint16(o+10,true),dt=cd.getUint16(o+12,true),dd=cd.getUint16(o+14,true);let csz=cd.getUint32(o+20,true),usz=cd.getUint32(o+24,true);

    const name=td.decode(new Uint8Array(cd.buffer,cd.byteOffset+o+46,nl));
    let xo=o+46+nl;const xe=xo+xl;while(xo+4<=xe){const id=cd.getUint16(xo,true),ln=cd.getUint16(xo+2,true);if(id===1){let q=xo+4;if(usz===0xFFFFFFFF){usz=Number(cd.getBigUint64(q,true));q+=8;}if(csz===0xFFFFFFFF){csz=Number(cd.getBigUint64(q,true));q+=8;}if(lo===0xFFFFFFFF)lo=Number(cd.getBigUint64(q,true));}xo+=4+ln;}
    const date=new Date(1980+(dd>>9),((dd>>5)&15)-1,dd&31,dt>>11,(dt>>5)&63,(dt&31)*2).getTime();

async function zipRead(file,en){const h=new DataView(await file.slice(en.lo,en.lo+30).arrayBuffer());const start=en.lo+30+h.getUint16(26,true)+h.getUint16(28,true);

async function importOsf(file,photosOnly){const t0=Date.now();

const OFFLINE="reisebuch-offline",MA_BOX={s:27.6,w:-13.3,n:35.95,e:-1.0};

function tileXY(lat,lon,z){const n=2**z,r=lat*Math.PI/180;
  return [Math.max(0,Math.min(n-1,Math.floor((lon+180)/360*n))),Math.max(0,Math.min(n-1,Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n)))];}
function tileKeys(areas,zmin,zmax){const set=new Set();
  for(const a of areas)for(let z=zmin;z<=zmax;z++){const[x1,y1]=tileXY(a.n,a.w,z),[x2,y2]=tileXY(a.s,a.e,z);
    for(let x=x1;x<=x2;x++)for(let y=y1;y<=y2;y++)set.add(z+"/"+x+"/"+y);}return set;}
function tileURL(lay,k){const[z,x,y]=k.split("/");const sd=lay.options.subdomains||"abc";
  return lay._url.replace("{s}",sd[Math.abs(+x+ +y)%sd.length]).replace("{z}",z).replace("{x}",x).replace("{y}",y);}
function offPlan(o){const lay=BASE[o.layer];const maxZ=Math.min(o.zmax,lay.options.maxZoom||19);
  const src0=o.only==="all"?points:points.filter(p=>p.trip===curTrip);
  let box=MA_BOX;if(src0.length){const la=src0.map(p=>p.lat),lo=src0.map(p=>p.lon);box={s:Math.min(...la)-1,n:Math.max(...la)+1,w:Math.min(...lo)-1,e:Math.max(...lo)+1};}
  const keys=tileKeys([box],5,8);
  const km=o.radius,src=o.only==="all"?points:o.only==="fix"?src0.filter(p=>p.status!=="idee"):src0;
  const areas=src.map(p=>{const dy=km/111,dx=km/(111*Math.cos(p.lat*Math.PI/180));return {s:p.lat-dy,n:p.lat+dy,w:p.lon-dx,e:p.lon+dx};});

   <div class="mgrp">${l.length?l.map((p,i)=>{const c=CATS[p.cat]||CATS.other;const left=Math.max(0,30-Math.floor((Date.now()-p.deletedAt)/864e5));

       <span class="oact"><button data-rs="${i}" title="Wiederherstellen">${mi("undo",18)}</button><button data-pg="${i}" title="Endgültig löschen">${mi("trash",18)}</button></span></div>`;}).join("")
     :`<div class="mrow" style="cursor:default"><span class="mtx"><small>Der Papierkorb ist leer.</small></span></div>`}</div>
   ${l.length?`<div class="actions"><button class="btn warn" id="tEmpty">Papierkorb leeren (${l.length})</button></div>`:""}`);
  $("#panel").querySelectorAll("[data-rs]").forEach(b=>b.onclick=async()=>{const p=l[+b.dataset.rs];await restorePoint(p);await loadPoints();toast(`«${ptTitle(p)}» wiederhergestellt`,3000);trashDialog();});
  $("#panel").querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{const p=l[+b.dataset.pg];confirmBox(`«${esc(ptTitle(p))}» endgültig löschen? Das lässt sich nicht rückgängig machen.`,async()=>{await purgePoint(p);trashDialog();});});
  const te=$("#tEmpty");if(te)te.onclick=()=>confirmBox(`Alle ${l.length} Punkte im Papierkorb endgültig löschen?`,async()=>{for(const p of l)await purgePoint(p);toast("Papierkorb geleert",2500);trashDialog();});}
/* ---------- «Bereit für unterwegs?»: prüft, ob die aktuelle Reise offline vollständig ist ---------- */
async function readyDialog(){openPanel(`<h2>Bereit für unterwegs?</h2><p class="muted">Wird geprüft …</p>`);
  await loadOffPacks();await loadPoiOff();const t=curTripObj();const pts=points.filter(p=>p.trip===curTrip);
  const inA=(p,a)=>p.lat>=a.s&&p.lat<=a.n&&p.lon>=a.w&&p.lon<=a.e;
  const cov=(f)=>pts.filter(p=>offPacks.some(pk=>f(pk)&&pk.areas.some(a=>a.z2>=12&&inA(p,a)))).length;
  const nMap=cov(()=>true),nSurf=cov(pk=>pk.surf);
  const ccs=[...new Set(pts.map(p=>p.country).filter(Boolean))],ccMiss=ccs.filter(c=>!poiOff.some(x=>x.cc===c));
  const lastS=+ls("rb_lastsync")||0,ageD=lastS?(Date.now()-lastS)/864e5:999,pend=(await getAll("points")).some(p=>(p.updated||0)>lastS);
  let persisted=false;try{persisted=navigator.storage&&navigator.storage.persisted?await navigator.storage.persisted():false;}catch(e){}
  const fam=famCfg();const nStory=pts.filter(p=>p.story).length;
  const st=(ok,warn)=>ok?["ok","✓"]:warn?["warn","!"]:["bad","✕"];
  const pc=n=>pts.length?Math.round(n/pts.length*100):0;
  const rows=[
    [st(gdClient()&&ageD<1&&!pend,gdClient()),"Abgleich mit Google Drive",!gdClient()?"Nicht eingerichtet – ohne Abgleich gibt es keine Sicherung":lastS?`Letzter Abgleich ${fmtDT(lastS)}${pend?" · seither Änderungen":""}`:"Noch nie abgeglichen",gdClient()?["Jetzt abgleichen",()=>{closePanel();syncDrive();}]:["Einrichten",gdSettings]],
    [st(pts.length&&nMap===pts.length,nMap>0),"Offline-Karten",pts.length?`${nMap} von ${pts.length} Punkten der Reise offline mit Detail ab Stufe 12 (${pc(nMap)} %)`:"Die aktuelle Reise hat noch keine Punkte",["Offline-Karten",offlineDialog]],
    [st(pts.length&&nSurf===pts.length,nSurf>0),"Strassenoberfläche offline",`${nSurf} von ${pts.length} Punkten (${pc(nSurf)} %)`,["Offline-Karten",offlineDialog]],
    [st(ccs.length&&!ccMiss.length,ccMiss.length<ccs.length),"POI-Overlay und Suche offline",ccs.length?(ccMiss.length?`Fehlt: ${ccMiss.map(countryName).join(", ")}`:`Gespeichert: ${ccs.map(countryName).join(", ")}`+(poiOff.some(p=>ccs.includes(p.cc)&&Date.now()-p.loaded>POI_OLD)?" · Stand älter als 3 Monate – neu laden empfohlen":"")):"Noch keine Länder bei den Punkten",["Länder laden",poiOffDialog]],
    [st(!!countryData,false),"Ländergrenzen",countryData?`${countryData.length} Länder – Land wird offline automatisch zugeordnet`:"Nicht geladen",["Laden",async()=>{toast("Lade Ländergrenzen …",60000);try{await downloadCountries();await assignCountries();toast("Geladen",2500);}catch(e){toast("Laden fehlgeschlagen",3000);}readyDialog();}]],
    [st(!!regionData,true),"Regionen Marokko",regionData?"Geladen – Region wird offline zugeordnet":"Nicht geladen (nur für Marokko nötig)",["Laden",async()=>{toast("Lade Regionsgrenzen …",60000);try{await downloadRegions();toast("Geladen",2500);}catch(e){toast("Laden fehlgeschlagen",3000);}readyDialog();}]],
    [st(famReady(),true),"Familienseite",famReady()?`${nStory} Storypoints markiert${fam.last?` · zuletzt veröffentlicht ${fmtDT(fam.last)}`:" · noch nie veröffentlicht"}`:"Nicht eingerichtet (freiwillig)",[famReady()?"Veröffentlichen":"Einrichten",famReady()?famPublish:famSettings]],
    [st(persisted,true),"Speicher geschützt",persisted?"Der Browser löscht die Daten nicht von selbst":"Nicht dauerhaft geschützt – App installieren (Chrome ⋮ › App installieren), dann schützt Android den Speicher",null],
  ];
  const nBad=rows.filter(r=>r[0][0]!=="ok").length;
  openPanel(`<h2>Bereit für unterwegs?</h2><p class="muted" style="margin-top:-6px">Reise: <b>${esc(t?t.name:"–")}</b> · ${pts.length} Punkte · ${nBad?`${nBad} Punkt${nBad>1?"e":""} offen`:"alles bereit ✓"}</p>
   <div class="mgrp">${rows.map((r,i)=>`<div class="mrow wrap" style="cursor:default"><span class="rdy ${r[0][0]}">${r[0][1]}</span><span class="mtx"><b>${r[1]}</b><small>${esc(r[2])}</small></span>${r[3]?`<button class="mact rbtn" data-r="${i}">${r[3][0]}</button>`:""}</div>`).join("")}</div>
   <p class="muted" style="margin-top:12px">Am besten zu Hause im WLAN erledigen. Offline-Karten und Orte für die anderen Abschnitte der Reise gleich mitladen.</p>`);
  $("#panel").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>rows[+b.dataset.r][3][1]());}
/* ---------- Start ---------- */
(async()=>{
  try{db=await openDB();}catch(e){toast("Speicher nicht verfügbar – Daten werden nicht gesichert",6000);return;}
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
  showSyncBtn();gdRestore();const _gdNew=gdFromRedirect();
  await loadMeta();
  if(ADM)admInit();
  await loadPoints();
  /* Reparatur: OsmAnd-Favoriten gehören zu keiner Reise (wurden beim Abgleich fälschlich «Marokko 2027» zugeordnet) */
  try{if(!localStorage.getItem("rb_fix_osm1")){let n=0;for(const p of await getAll("points"))if(!p.deleted&&p.trip===MIG_TRIP&&/^OsmAnd/.test(p.source||"")){p.trip="";p.updated=Date.now();await put("points",p);n++;}
    localStorage.setItem("rb_fix_osm1","1");if(n){await loadPoints();setTimeout(()=>toast(`${n} OsmAnd-Orte wieder ohne Reise`,5000),2500);}}}catch(e){}
  /* Kategorie «Tierbeobachtung» entfernt: bestehende Punkte werden zu «Sehenswürdigkeit» */
  try{let n=0;for(const p of await getAll("points"))if(!p.deleted&&p.cat==="wildlife"){p.cat="sight";p.updated=Date.now();await put("points",p);n++;}if(n){await loadPoints();setTimeout(()=>toast(`${n} Punkte «Tierbeobachtung» sind jetzt «Sehenswürdigkeit»`,5000),2500);}}catch(e){}
  trashPurgeOld().catch(()=>{});
  await loadFlags();wakeAcquire();if(surfOn&&!ADM)surfLayer.addTo(map);loadPoiOff().then(drawOsm);await loadOffPacks();drawOffAreas();
  showHeaderTrip();setTimeout(handleShare,600);setTimeout(async()=>{if(!countryData){await ensureCountries();}else{await assignCountries();}},1500);
  if(_gdNew||sessionStorage.getItem("rb_after_login")){try{sessionStorage.removeItem("rb_after_login");}catch(e){}if(gdToken)setTimeout(()=>syncDrive(),400);}
  try{const o=await getOne("meta","osmpoi");if(o)osmData={items:o.items||[],loaded:o.loaded,scope:o.scope||""};}catch(e){}drawOsm();
  /* letzte Kartenansicht wiederherstellen (beim Neuladen, nach Update oder Google-Anmeldung) – sonst alle Punkte zeigen */
  let lv=null;try{lv=JSON.parse(localStorage.getItem("rb_view")||"null");}catch(e){}
  if(lv&&isFinite(lv.lat)&&isFinite(lv.lon)&&isFinite(lv.z))map.setView([lv.lat,lv.lon],lv.z,{animate:false});
  else if(points.length){const b=L.latLngBounds(points.map(p=>[p.lat,p.lon]));map.fitBounds(b,{padding:[30,30]});}
  map.on("moveend",()=>{const c=map.getCenter();try{localStorage.setItem("rb_view",JSON.stringify({lat:+c.lat.toFixed(5),lon:+c.lng.toFixed(5),z:map.getZoom()}));}catch(e){}});
  if(!ADM)startGPS();
  $("#ver").textContent=VERSION;
  if("serviceWorker" in navigator&&location.protocol==="https:"){
    const hadCtrl=!!navigator.serviceWorker.controller;let reloaded=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!hadCtrl||reloaded)return;reloaded=true;toast("Neue Version wird geladen …",3000);setTimeout(()=>location.reload(),600);});
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{swReg=r;r.update().catch(()=>{});}).catch(()=>{});
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&swReg)swReg.update().catch(()=>{});});}
})();
</script>
